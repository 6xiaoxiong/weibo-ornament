
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>微博记账</title>
<style>
:root{
  --p:#F2D7DC;--pl:#FCE4EC;--pd:#D484A9;
  --g:#66BB6A;--r:#EF5350;--b:#E0E0E0;
  --bg:#FFF7F9;--c:#FFFFFF;--c2:#FFFFFF;
  --t1:#9F8F82;--t2:#9F8F82;--t3:#B0A093;
  --line:rgba(255,255,255,0.25);
  --radius:32px;--radius-sm:24px;--radius-xs:20px;
  --shadow:0 8px 32px rgba(0,0,0,0.06);
  --glass:rgba(255,255,255,0.72);--glass-blur:blur(24px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t1);font-size:15px;padding-bottom:90px;line-height:1.55;letter-spacing:0.01em}
h1,h2,h3{margin:0;font-weight:600}
input,select,textarea,button{font-family:inherit;font-size:15px;border:none;outline:none;width:100%;background:transparent}
textarea{resize:vertical;min-height:60px}
button{cursor:pointer;background:none;color:var(--t1)}

.pg{display:none;padding:20px 16px;max-width:600px;margin:0 auto;animation:fa .35s ease}
.pg.ac{display:block}
@keyframes fa{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.gc{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:none;border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:0 4px 16px rgba(0,0,0,0.03);position:relative}
.gc::before{display:none;content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);border-radius:var(--radius) var(--radius) 0 0;pointer-events:none}

.ov{display:flex;flex-direction:column;gap:14px;margin-bottom:20px;width:100%}
.ov-c{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:none;border-radius:var(--radius);padding:18px 16px;box-shadow:0 4px 16px rgba(0,0,0,0.03);position:relative}
.ov-c::before{display:none;content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);border-radius:var(--radius) var(--radius) 0 0;pointer-events:none}
.ov-t{font-size:12px;color:var(--t2);margin-bottom:6px;letter-spacing:0.03em}
.ov-v{font-size:24px;font-weight:700;color:var(--pd)}
.ov-v.g{color:var(--g)}.ov-v.r{color:var(--r)}

.act-w{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.act-w::-webkit-scrollbar{display:none}
.act-b{flex-shrink:0;padding:10px 18px;border-radius:40px;font-size:14px;font-weight:500;white-space:nowrap;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:none;color:var(--t1);box-shadow:0 2px 12px rgba(0,0,0,0.03);transition:.2s}
.act-b.pri{background:rgba(242,215,217,0.65);color:var(--pd);border-color:rgba(242,215,217,0.5)}

.cat-w{display:flex;gap:12px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-w::-webkit-scrollbar{display:none}
.cat-b{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 18px;border-radius:var(--radius-sm);background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:none;min-width:80px;box-shadow:0 2px 12px rgba(0,0,0,0.03);cursor:pointer;transition:.2s}
.cat-b .ic{font-size:24px}.cat-b .lb{font-size:12px;color:var(--t2);font-weight:500}

.period-w{display:flex;gap:8px;margin-bottom:16px}
.period-b{padding:6px 14px;border-radius:20px;font-size:13px;color:var(--t2);background:var(--c2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(16px);border:none;cursor:pointer;transition:.2s}
.period-b.ac{background:rgba(242,215,217,0.6);color:var(--pd);border-color:rgba(242,215,217,0.5)}
.hex-img-upload{width:50px;height:50px;border-radius:10px;background:var(--c2);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex-shrink:0}

/* home list card: white background, three rows */
.hc-list{background:#FFFFFF;border-radius:var(--radius-sm);padding:14px 16px;margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,0.04);cursor:pointer;position:relative;transition:transform .2s;display:flex;gap:14px}
.hc-list:active{transform:scale(0.98)}
.hc-img-wrap{flex-shrink:0;width:64px;height:64px}
.hc-img{width:100%;height:100%;border-radius:var(--radius-xs);background:var(--c2);overflow:hidden}
.hc-img img{width:100%;height:100%;object-fit:cover}
.hc-content{flex:1;min-width:0}
.hc-row1{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hc-name2{font-size:16px;font-weight:600;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;margin-right:12px}
.hc-cost{font-size:13px;color:var(--t2);white-space:nowrap;flex-shrink:0}
.hc-tags-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.hc-tag2{font-size:11px;padding:3px 10px;border-radius:12px;background:rgba(252,228,236,0.7);color:var(--pd);font-weight:500;white-space:nowrap;display:inline-block}
.hc-tag2.p,.hc-tag2.n{background:#D9F7BE;color:rgba(0,0,0,0.7)}
.hc-tag2.x,.hc-tag2.r{background:#C9E7FF;color:rgba(0,0,0,0.7)}
.hc-tag2.y,.hc-tag2.h{background:#E56770;color:#fff}
.hc-tag2.s,.hc-tag2.l{background:#FFE873;color:rgba(0,0,0,0.7)}
.hc-act{display:flex;gap:10px;flex-wrap:nowrap}
.hc-act button{flex:1;padding:8px 16px;border-radius:var(--radius-xs);font-size:13px;border:none;font-weight:500;white-space:nowrap;cursor:pointer;transition:opacity .2s}
.hc-act button:hover{opacity:0.85}
.hc-btn-edit{background:#E8E8E8;color:var(--t1)}
.hc-btn-sell{background:rgba(102,187,106,0.15);color:#66BB6A}

/* list view */
.lr{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#FFFFFF;border:none;border-radius:var(--radius-sm);margin-bottom:10px;box-shadow:0 2px 12px rgba(242,215,220,0.2)}
.lr-img{width:48px;height:48px;border-radius:10px;overflow:hidden;background:#FFFFFF;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lr-img img{width:100%;height:100%;object-fit:cover}
.lr-body{flex:1;min-width:0}
.lr-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-sub{font-size:13px;color:var(--t2);margin-top:2px}
.lr-row1{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-width:0}
.lr-cost{font-size:13px;color:var(--t3);white-space:nowrap;flex-shrink:0}
.lr-row2{margin-top:4px}
.lr-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:2px}
.lr-acts{display:flex;gap:6px;margin-top:6px}
.lr-btn{flex:1;padding:6px 0;border:none;border-radius:8px;font-size:12px;background:var(--c2);color:var(--t2);cursor:pointer;font-weight:500}
.lr-btn.s{color:var(--g);background:rgba(102,187,106,0.12)}
.lr-pl{font-size:15px;font-weight:700;white-space:nowrap}
.lr-pl.r{color:var(--r)}.lr-pl.g{color:var(--g)}

/* grid view */
.grw{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gr{background:var(--c2);backdrop-filter:blur(24px);border:none;border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column}
.gr-img{width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:#FFFFFF;display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.gr-img img{width:100%;height:100%;object-fit:cover}
.gr-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.gr-sub{font-size:13px;color:var(--t2);margin-bottom:6px}
.gr-pl{font-size:16px;font-weight:700}
.gr-pl.r{color:var(--r)}.gr-pl.g{color:var(--g)}

.iqr{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#FFFFFF;border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.4)}
.iql{font-size:14px;font-weight:500;min-width:40px}
.iqrem{font-size:12px;color:var(--t3);margin-right:auto}
.iqq{width:48px;text-align:center;border:none;background:transparent;font-size:14px;padding:5px}

.avg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.avc{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:none;border-radius:var(--radius);padding:12px;text-align:center;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,0.03);transition:transform .2s}
.avc:active{transform:scale(0.97)}
.avimg{height:80px;border-radius:var(--radius-sm);background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:10px;overflow:hidden}
.avimg img{width:100%;height:100%;object-fit:cover}
.avn{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avp{font-size:12px;color:var(--pd);margin-top:3px;font-weight:500}

.det-h{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:none;border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 2px 12px rgba(0,0,0,0.03)}
.detsec{background:#FFFFFF;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:none;border-radius:var(--radius-sm);padding:14px;margin-top:12px}

.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;color:var(--t2);margin-bottom:8px;font-weight:500;letter-spacing:0.02em}
.fg input,.fg select,.fg textarea{background:var(--c2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:none;border-radius:var(--radius-xs);padding:12px 14px;font-size:15px;color:var(--t1);transition:.2s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--pd);box-shadow:0 0 0 3px rgba(242,215,217,0.3)}
.fg textarea{min-height:64px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bt{padding:13px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;text-align:center;transition:transform .15s,box-shadow .15s;letter-spacing:0.02em}
.bt:active{transform:scale(0.97)}
.bp{background:rgba(242,215,217,0.75);color:var(--pd);border:1px solid rgba(242,215,217,0.5);box-shadow:0 4px 16px rgba(242,215,217,0.3)}
.bg{background:var(--c2);color:var(--t1);border:none;backdrop-filter:blur(12px)}
.bd{background:rgba(239,83,80,0.15);color:var(--r);border:1px solid rgba(239,83,80,0.3)}

/* edit modal image preview square on top */
.edit-img-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.edit-img-preview{width:80px;height:80px;border-radius:var(--radius-sm);background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative;border:none}
.edit-img-preview img{width:100%;height:100%;object-fit:cover}
.edit-img-preview .img-u-r{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.4);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:13px;z-index:2;backdrop-filter:blur(8px);cursor:pointer}

.img-u{height:120px;border:2px dashed rgba(212,132,169,0.4);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;position:relative;overflow:hidden;background:#FFFFFF;transition:.2s}
.img-u.has-img{border-style:solid;border-color:rgba(242,215,217,0.5);background:var(--c)}
.img-u img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.img-u-r{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.4);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:15px;z-index:2;backdrop-filter:blur(8px);cursor:pointer}

.fl-i{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.3)}
.fl-n{font-size:14px;font-weight:500}.fl-d{font-size:12px;color:var(--t2);margin-top:3px}
.fl-v{font-size:15px;font-weight:700}.fl-v.g{color:var(--g)}.fl-v.r{color:var(--r)}

/* bottom nav: text only, bold */
.bn{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:center;align-items:center;background:rgba(255,255,255,0.65);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.4);border-radius:var(--radius);padding:10px 6px calc(10px + env(safe-area-inset-bottom) / 2);z-index:50;box-shadow:0 8px 40px rgba(0,0,0,0.12)}
.bi{flex:1;padding:8px 2px;background:none;border:none;color:var(--t2);font-size:15px;cursor:pointer;border-radius:16px;transition:.2s;min-width:0;font-weight:600;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.bi.ac{color:var(--pd)}
.naf{width:44px;height:44px;border-radius:50%;background:rgba(159,143,130,0.15);color:#9F8F82;display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 20px rgba(159,143,130,0.15);transition:transform .15s;font-weight:400}
.naf:active{transform:scale(0.93)}
.bi.refreshing{animation:refreshPulse .3s ease}
@keyframes refreshPulse{0%{transform:scale(1)}50%{transform:scale(0.92)}100%{transform:scale(1)}}

.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.2);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.mo.ac{display:flex}
.md{background:rgba(255,255,255,0.88);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:none;border-radius:var(--radius) var(--radius) 0 0;padding:24px 20px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;animation:bu .35s ease;box-shadow:0 -8px 40px rgba(0,0,0,0.08)}
@keyframes bu{from{transform:translateY(100%)}to{transform:translateY(0)}}
.md h3{text-align:center;margin-bottom:18px;color:var(--pd);font-size:18px;font-weight:600}

.st-i{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:none;border-radius:var(--radius-sm);margin-bottom:12px;box-shadow:0 2px 12px rgba(0,0,0,0.03)}
.st-t{font-size:15px;font-weight:500;color:var(--t1)}.st-d{font-size:12px;color:var(--t2);margin-top:3px}

.tg{width:52px;height:30px;border-radius:15px;background:rgba(224,224,224,0.7);position:relative;cursor:pointer;transition:.25s;flex-shrink:0;border:none}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.tg.on{background:rgba(242,215,217,0.8);border-color:rgba(242,215,217,0.5)}
.tg.on::after{left:23px;background:var(--pd)}

.empty{text-align:center;padding:48px 20px;color:var(--t3);font-size:14px;letter-spacing:0.02em}

#to{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);color:#fff;padding:10px 22px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
#to.sw{opacity:1}

.stats-g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.stats-c{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:none;border-radius:var(--radius-sm);padding:16px;box-shadow:0 2px 12px rgba(0,0,0,0.03)}
.stats-lb{font-size:12px;color:var(--t2);margin-bottom:4px}.stats-v{font-size:20px;font-weight:700;color:var(--t1)}

.cat-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:8px 16px;border-radius:20px;font-size:13px;color:var(--t2);background:var(--c2);backdrop-filter:blur(12px);border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.2s}
.cat-tab.ac{background:rgba(242,215,217,0.6);color:var(--pd);border-color:rgba(242,215,217,0.5)}

.view-sw{display:flex;gap:6px;margin-bottom:16px}
.view-b{padding:6px 12px;border-radius:16px;font-size:13px;color:var(--t2);background:var(--c2);border:none;cursor:pointer;transition:.2s}
.view-b.ac{background:rgba(242,215,217,0.5);color:var(--pd)}

.quality-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:10px;background:#FFFFFF;backdrop-filter:blur(12px);border:none;border-radius:var(--radius-xs)}
.quality-row input{flex:1;padding:8px 10px;border:none;border-radius:10px;font-size:14px;background:var(--c2)}
.quality-row input[type=number]{width:60px;padding:8px 6px;text-align:center}
.qty-btn{width:32px;height:32px;border-radius:10px;background:rgba(242,215,217,0.3);color:var(--pd);border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.tl{position:relative;padding-left:24px}
.tl::before{display:none;content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,rgba(242,215,217,0.6),rgba(242,215,217,0.1))}
.tl-i{position:relative;padding:14px 0 14px 16px}
.tl-i::before{display:none;content:"";position:absolute;left:-20px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--p);border:2px solid #fff;box-shadow:0 2px 8px rgba(242,215,217,0.4)}
.tl-i .tl-t{font-size:12px;color:var(--t2);margin-bottom:4px}
.tl-i .tl-n{font-size:14px;font-weight:500}
.tl-i .tl-v{font-size:14px;font-weight:600;margin-top:3px}
.tl-i .tl-v.g{color:var(--g)}.tl-i .tl-v.r{color:var(--r)}

.hs{margin-bottom:16px}
.hs-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hs-t{font-size:16px;font-weight:600}.hs-a{font-size:13px;color:var(--pd);cursor:pointer}

/* flow merged timeline */
.flow-hd{font-size:18px;color:#7a6e63;margin:18px 0 8px;padding-left:8px;border-left:3px solid var(--p);font-weight:700}

/* home cards scroll - 150px wide cards with horizontal scroll */
.hc-scroll{display:flex;gap:12px;overflow-x:auto;padding:12px 4px;scrollbar-width:none}
.hc-scroll::-webkit-scrollbar{display:none}

/* 150px wide card */
.hc-wide{width:150px;flex-shrink:0;border-radius:16px;overflow:hidden;position:relative;background:#FFFFFF;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.hc-wide .hc-img{height:100px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--cat-bg,#f5f5f5)}
.hc-wide .hc-img img{width:100%;height:100%;object-fit:cover}
.hc-wide .hc-body{padding:10px}
.hc-wide .hc-n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-wide .hc-pl{font-size:12px;font-weight:700;margin-top:4px;color:var(--t2)}

/* Pink badge for count */
.hc-badge{position:absolute;top:8px;right:8px;background:var(--pd);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;min-width:20px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,0.15)}

/* 80px small narrow module - vertical stack */
.hc-small-wrap{display:flex;flex-direction:column;gap:10px}
.hc-small{width:80px;height:80px;flex-shrink:0;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--cat-bg,#f5f5f5);overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.05)}
.hc-small img{width:100%;height:100%;object-fit:cover}

/* Category background colors */
.cat-bg-o{--cat-bg:#FFF0F3}
.cat-bg-p{--cat-bg:#F0F7FF}
.cat-bg-w{--cat-bg:#F0FFF4}
.cat-bg-a{--cat-bg:#FFF8F0}
</style>
</head>
<body>
<div id="to"></div>

<div class="pg ac" id="p-home">
  <div class="ov" id="ov"></div>
  <div class="period-w" id="period-w"></div>

<script>
const K='wb_ornament_v8';
let D=ld(),CID=null,TEMP_IMG='',CAT='o';

function ld(){
  try{var d=JSON.parse(localStorage.getItem(K));if(d&&d.v>=8)return d;}
  catch(e){}
  var migrations=['wb_ornament_v7','wb_ornament_v6','wb_ornament_v5','wb_ornament_v4'];
  for(var mi=0;mi<migrations.length;mi++){
    try{
      var old=JSON.parse(localStorage.getItem(migrations[mi]));
      if(old&&old.rs){
        var nd={v:8,rs:old.rs||[],ss:old.ss||[],
          cats:old.cats||{o:true,p:true,w:true,a:true},
          settings:old.settings||{nav:{o:true,p:true,w:true,a:true},homeCats:{o:true,p:true,w:true,a:true}}};
        localStorage.setItem(K,JSON.stringify(nd));
        return nd;
      }
    }catch(e){}
  }
  return{v:8,rs:[],ss:[],cats:{o:true,p:true,w:true,a:true},
    settings:{nav:{o:true,p:true,w:true,a:true},homeCats:{o:true,p:true,w:true,a:true}}};
}
function sv(){D.v=8;localStorage.setItem(K,JSON.stringify(D))}
function today(){return new Date().toISOString().slice(0,10)}

function st(msg){var t=document.getElementById('to');t.textContent=msg;t.classList.add('sw');setTimeout(function(){t.classList.remove('sw')},2000)}
function op(id){document.getElementById(id).classList.add('ac')}
function cl(id){document.getElementById(id).classList.remove('ac')}
function clSell(){document.getElementById('bb-sell').style.display='none'}

var lastTab='';
function sp(p,cat){
  if(p===lastTab){
    if(p==='home')renderHome();
    else if(p==='stats')renderStats();
    else if(p==='cat'){CAT=cat||'o';renderCat();}
    else if(p==='sell')rsf();
    else if(p==='flow')rf();
    else if(p==='settings')renderSettings();
    window.scrollTo({top:0,behavior:'smooth'});
    var btn=document.querySelector('.bi[data-p="'+p+'"]');
    if(btn){btn.classList.add('refreshing');setTimeout(function(){btn.classList.remove('refreshing')},500);}
    st('已刷新');
    return;
  }
  lastTab=p;
  document.querySelectorAll('.pg').forEach(function(x){x.classList.remove('ac')});
  var pg=document.getElementById('p-'+p);
  if(pg)pg.classList.add('ac');
  document.querySelectorAll('.bi').forEach(function(x){x.classList.remove('ac')});
  if(p==='home')renderHome();
  else if(p==='stats')renderStats();
  else if(p==='cat'){CAT=cat||'o';renderCat();}
  else if(p==='sell')rsf();
  else if(p==='flow')rf();
  else if(p==='settings')renderSettings();
  updateNavActive();
}

function updateNavActive(){
  var curPage=document.querySelector('.pg.ac');
  if(!curPage)return;
  var pid=curPage.id.replace('p-','');
  document.querySelectorAll('.bi').forEach(function(b){
    var bp=b.dataset.p;
    if(bp===pid){
      if(pid==='cat'){
        if(b.dataset.cat===CAT)b.classList.add('ac');
      }else{
        b.classList.add('ac');
      }
    }
  });
}

function renderNav(){
  var nav=document.getElementById('nav');
  var html='';
  html+='<button class="bi" data-p="home" onclick="sp(\'home\')">首页</button>';
  html+='<button class="bi" data-p="stats" onclick="sp(\'stats\')">统计</button>';
  html+='<button class="bi" onclick="op(\'ma\');document.getElementById(\'at\').value=\'o\';atc()"><span class="naf">＋</span></button>';
  html+='<button class="bi" data-p="flow" onclick="sp(\'flow\')">流水</button>';
  html+='<button class="bi" data-p="settings" onclick="sp(\'settings\')">设置</button>';
  nav.innerHTML=html;
  updateNavActive();
}

var HF_PERIOD='all';
function renderHome(){
  // 所有记录按新到旧排列（id越大越新）
  var allRs=(D.rs||[]).slice().sort(function(a,b){return b.id-a.id});
  
  // 顶部统计总览
  var totalInvest=0,totalRecover=0;
  (D.rs||[]).forEach(function(r){
    if(r.t==='o'||r.t==='p')totalInvest+=r.tc||0;
    else if(r.t==='w')totalInvest+=r.pr||0;
    else if(r.t==='a'){(r.is||[]).forEach(function(i){totalInvest+=i.p||0})}
  });
  (D.ss||[]).forEach(function(s){totalRecover+=s.tp||0});
  var initialBalance = (D.settings && D.settings.initialBalance) || 0;
  var netProfit = initialBalance + totalRecover - totalInvest;
  
  document.getElementById('ov').innerHTML=
    '<div style="display:flex;flex-direction:column;gap:10px;width:100%;max-width:100%">'+
      '<div class="stats-c" style="width:100%;box-sizing:border-box;grid-column:1 / -1">'+
        '<div class="stats-lb">初始净收益</div>'+
        '<div style="font-size:20px;font-weight:700;color:var(--'+(initialBalance>=0?'g':'r')+')">('+(initialBalance>=0?'\u00a5+':'\u00a5-')+Math.abs(initialBalance).toFixed(2)+')</div>'+
      '</div>'+
      '<div style="display:flex;gap:12px;width:100%;box-sizing:border-box">'+
        '<div class="stats-c" style="width:calc(50% - 6px);box-sizing:border-box"><div class="stats-lb">总支出</div><div style="font-size:20px;font-weight:700;color:var(--r)">(\u00a5-'+(totalInvest||0).toFixed(2)+')</div></div>'+
        '<div class="stats-c" style="width:calc(50% - 6px);box-sizing:border-box"><div class="stats-lb">总收入</div><div style="font-size:20px;font-weight:700;color:var(--g)">(\u00a5+'+(totalRecover||0).toFixed(2)+')</div></div>'+
      '</div>'+
      '<div class="stats-c" style="width:100%;box-sizing:border-box;grid-column:1 / -1">'+
        '<div class="stats-lb">净盈亏</div>'+
        '<div style="font-size:20px;font-weight:700;color:var(--'+(netProfit>=0?'g':'r')+')">('+(netProfit>=0?'\u00a5+':'\u00a5-')+Math.abs(netProfit).toFixed(2)+')</div>'+
      '</div>'+
    '</div>';

  // 顶部功能区：记支出和记收入按钮并排
  document.getElementById('act-w').innerHTML=
    '<button class="act-b pri" onclick="op(\'ma\');document.getElementById(\'at\').value=\'o\';atc()" style="color:var(--pd);flex:1">\uff0b 记支出</button>'+
    '<button class="act-b" onclick="openIncome()" style="color:var(--g);background:rgba(102,187,106,0.12);border-color:rgba(102,187,106,0.3);flex:1">\uff0b 记收入</button>';
  document.getElementById('act-w').style.display='flex';
  document.getElementById('act-w').style.gap='12px';

  // 清空时间段选择和分类区域
  document.getElementById('period-w').innerHTML='';
  document.getElementById('cat-w').innerHTML='';

  // 按分类渲染记录列表
  var catNames3={o:'微博装扮',p:'个性装扮',w:'福利赏',a:'六边形头像'};
  var catBgClass={o:'cat-bg-o',p:'cat-bg-p',w:'cat-bg-w',a:'cat-bg-a'};
  var html='';
  
  // 详细列表
  html+='<div style="margin-top:24px">';
  ['o','p','w','a'].forEach(function(ck){
    var list=allRs.filter(function(r){return r.t===ck});
    if(list.length===0)return;
    html+='<div style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:16px;font-weight:600;color:var(--t1)">'+catNames3[ck]+'</div><div style="font-size:13px;color:var(--pd);cursor:pointer" onclick="sp(\'cat\',\''+ck+'\')">\u67e5\u770b\u5168\u90e8 ></div></div>';
    list.forEach(function(r){html+=renderHomeCard(r)});
    html+='</div>';
  });
  html+='</div>';
  
  if(allRs.length===0)html='<div class="empty">\u6682\u65e0\u8bb0\u5f55\uff0c\u70b9\u51fb\u300c\u8bb0\u4e00\u7b14\u300d\u6dfb\u52a0</div>';
  document.getElementById('hc').innerHTML=html;
}

function getQualityLabel(k){
  var map={p:'\u666e\u901a',x:'\u7a00\u6709',y:'\u9690\u85cf',s:'\u8d85\u795e',n:'\u666e\u901a',r:'\u7a00\u6709',h:'\u9690\u85cf',l:'\u8d85\u795e'};
  return map[k]||k;
}

function getSoldAmount(rid,ss){
  var amt=0;
  (ss||D.ss||[]).forEach(function(s){if(s.rid===rid)amt+=s.tp||0});
  return amt;
}

function renderHomeCard(r){
  // 左侧图片占位
  var imgHtml='<div class="hc-img-wrap"><div class="hc-img">'+(r.img?'<img src="'+esc(r.img)+'">':'')+'</div></div>';
  
  // 第一行：记录名称 + 总支出（13px灰色字体）
  var nameLine='<div class="hc-name2">'+esc(r.n)+'</div>';
  var costLine='<span class="hc-cost">总支出&nbsp;&nbsp;&nbsp;¥'+(r.tc||0).toFixed(2)+'</span>';
  
  // 第二行：所有品质标签
  var tagsLine='';
  if(r.ts&&r.ts.length>0){
    var tagParts=[];
    r.ts.forEach(function(t){
      if((t.c||0)>0)tagParts.push({label:getQualityLabel(t.k||t.n)+' '+(t.c||0),key:t.k||''});
    });
    if(tagParts.length>0){
      tagsLine='<div class="hc-tags-row">'+tagParts.map(function(t){return '<span class="hc-tag2 '+(t.key||'')+'">'+esc(t.label)+'</span>'}).join('')+'</div>';
    }
  }
  
  // 第三行：编辑、卖出按钮（移除删除按钮，编辑按钮改为灰色）
  var buttonsLine='<div class="hc-act" onclick="event.stopPropagation()">'+
    '<button class="hc-btn-edit" onclick="er(\''+r.id+'\')">编辑</button>'+
    '<button class="hc-btn-sell" onclick="selFromCard(\''+r.id+'\')">卖出</button></div>';

  return '<div class="hc-list" onclick="od(\''+r.id+'\')">'+
    imgHtml+
    '<div class="hc-content">'+
    '<div class="hc-row1">'+nameLine+costLine+'</div>'+
    tagsLine+
    buttonsLine+
    '</div></div>';
}

function renderCard(r){
  return renderHomeCard(r);
}

function renderStats(){
  var cats=['o','p','w','a'];
  var catNames={o:'\u5fae\u535a\u88c5\u626e',p:'\u4e2a\u6027\u88c5\u626e',w:'\u798f\u5229\u8d4f',a:'\u516d\u8fb9\u5f62\u5934\u50cf'};

  // 全局总统计
  var totalInvestAll=0,totalRecoverAll=0,totalInventory=0;
  cats.forEach(function(c){
    (D.rs||[]).filter(function(r){return r.t===c}).forEach(function(r){
      if(r.t==='o'||r.t==='p'){
        totalInvestAll+=r.tc||0;
        (r.ts||[]).forEach(function(t){totalInventory+=t.c||0;});
      }
      else if(r.t==='w'){
        totalInvestAll+=r.pr||0;
        totalInventory+=1;
      }
      else if(r.t==='a'){
        (r.is||[]).forEach(function(i){
          totalInvestAll+=i.p||0;
          if(!i._sold)totalInventory+=1;
        });
      }
    });
  });
  (D.ss||[]).forEach(function(s){totalRecoverAll+=s.tp||0;});
  var initialBalance=(D.settings&&D.settings.initialBalance)||0;
  var netProfit=initialBalance+totalRecoverAll-totalInvestAll;

function handleHexImg(input,idx){
  var file=input.files[0];

function handleImg(input,previewId){

    el.classList.add('has-img');

    var tc=parseFloat(document.getElementById('atc2').value)||0;

function stp(){

function rf(){
  var fm=document.getElementById('fm').value;
  var fmCompare=fm?fm.replace(/\//g,'-'):''; // 转换为 yyyy-mm-dd 格式用于比较
  var events=[];
  (D.rs||[]).forEach(function(r){
    if(r.rm&&r.rm.includes('初始余额'))return;
    if(!fm||(r.d||'').slice(0,10)===fmCompare){
      events.push({time:r.ca||r.d||'',type:'buy',name:r.n,rm:r.rm,date:r.d||'',cat:r.t,amount:-((r.t==='w'?r.pr:r.tc)||0)});
    }
  });
  (D.ss||[]).forEach(function(s){
    if(s.rm&&s.rm.includes('初始余额'))return;
    if(!fm||(s.d||'').slice(0,10)===fmCompare){
      var r=D.rs.find(function(x){return x.id===s.rid});
      var cost=0;
      if(r){
        if(r.t==='a'){var i=(r.is||[])[s.ii];if(i)cost=i.p||0}
        else{var t=(r.ts||[]).find(function(x){return x.k===s.tk});if(t&&r.tc>0){var ti2=r.ts.reduce(function(sum,x){return sum+x.c},0)||1;cost=(r.tc/ti2)*(s.q||1)}}
      }
      events.push({time:s.ca||s.d||'',type:'sell',name:s.tn||'',rm:s.rm,date:s.d||'',amount:s.tp||0,cost:cost,q:s.q||1});
    }
  });
  events.sort(function(a,b){return (b.time||'').localeCompare(a.time||'')});

  var html='';
  var lastDate='';
  function fmtAmt(amt){
    var v=Math.abs(amt);
    return (v%1===0)?v.toFixed(0):v.toFixed(2);
  }
  events.forEach(function(ev){
    var d=(ev.time||'').slice(0,10);
    if(d!==lastDate){html+='<div class="flow-hd" style="margin-bottom:8px">'+d+'</div>';lastDate=d}
    if(ev.type==='buy'){
      var remark=ev.rm?'<span style="color:var(--t2);font-size:12px;margin-left:6px">'+esc(ev.rm)+'</span>':'';
      html+='<div class="fl-i" style="background:#ffffff;border-radius:12px;padding:12px;margin-bottom:8px"><div><div class="fl-n" style="font-weight:700">'+esc(ev.name)+remark+'</div></div><div class="fl-v r" style="font-weight:700">\u652f\u51fa&nbsp;&nbsp;&nbsp;-'+fmtAmt(ev.amount)+'</div></div>';
    }else{
      var remark=ev.rm?'<span style="color:var(--t2);font-size:12px;margin-left:6px">'+esc(ev.rm)+'</span>':'';
      html+='<div class="fl-i" style="background:#ffffff;border-radius:12px;padding:12px;margin-bottom:8px"><div><div class="fl-n" style="font-weight:700">'+esc(ev.name)+remark+'</div></div><div class="fl-v g" style="font-weight:700">\u6536\u5165&nbsp;&nbsp;&nbsp;+'+fmtAmt(ev.amount)+'</div></div>';
    }
  });
  document.getElementById('fl').innerHTML=html||'<div class="empty">\u6682\u65e0\u6d41\u6c34\u6570\u636e</div>';
}

function renderSettings(){
  var catNames={o:'\u5fae\u535a\u88c5\u626e',p:'\u4e2a\u6027\u88c5\u626e',w:'\u798f\u5229\u8d4f',a:'\u516d\u8fb9\u5f62\u5934\u50cf'};
  var homeCats=D.settings.homeCats||{o:true,p:true,w:true,a:true};
  var html='';
  ['o','p','w','a'].forEach(function(c){
    html+='<div class="st-i">'+
      '<div><div class="st-t">'+catNames[c]+'</div><div class="st-d">\u5728\u9996\u9875\u663e\u793a</div></div>'+
      '<div class="tg '+(homeCats[c]?'on':'')+'" onclick="toggleSetting(\'homeCats\',\''+c+'\')"></div></div>';
  });
  document.getElementById('settings-display').innerHTML=html;
  // 设置初始余额输入框的值
  document.getElementById('initial-balance').value = (D.settings.initialBalance !== undefined) ? D.settings.initialBalance.toFixed(2) : '';
}
function saveInitialBalance(){
  var val = parseFloat(document.getElementById('initial-balance').value) || 0;
  D.settings = D.settings || {};
  D.settings.initialBalance = val;
  sv();
  renderHome();
}
function toggleSetting(key,cat){
  D.settings=D.settings||{homeCats:{}};
  D.settings[key]=D.settings[key]||{};
  D.settings[key][cat]=D.settings[key][cat]===false?true:false;
  sv();
  renderSettings();
}

function ex(){
  var data=JSON.stringify(D,null,2);
  var blob=new Blob([data],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='\u5fae\u535a\u8bb0\u8d26\u5907\u4efd_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();URL.revokeObjectURL(url);
  st('\u5df2\u5bfc\u51fa');
}
function im(e){
  var f=e.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{var d=JSON.parse(ev.target.result);if(d.rs){D=d;D.v=8;sv();renderHome();st('\u5bfc\u5165\u6210\u529f')}else{st('\u683c\u5f0f\u9519\u8bef')}}
    catch(err){st('\u6587\u4ef6\u8bfb\u53d6\u5931\u8d25')}
  };
  r.readAsText(f);e.target.value='';
}
function recover(){
  var found=[],best=null,bestSize=0;
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(!k)continue;
    if(/ornament|weibo|data/i.test(k)){
      try{var v=localStorage.getItem(k);var info={key:k,size:v.length};try{var p=JSON.parse(v);info.rs=(p.rs||[]).length;info.ss=(p.ss||[]).length;if(v.length>bestSize){bestSize=v.length;best=p}}catch(e){}found.push(info)}catch(e){}
    }
  }
  if(found.length===0){st('\u672a\u627e\u5230\u65e7\u6570\u636e');return}
  var msg='\u627e\u5230'+found.length+'\u4e2a\u6570\u636e\uff1a\n'+found.map(function(x){return x.key+' (\u8bb0\u5f55'+x.rs+'\u6761)'}).join('\n')+'\n\n\u5bfc\u5165\u6700\u5927\u7684\uff1f';
  document.getElementById('ct').textContent='\u6062\u590d\u6570\u636e';
  document.getElementById('cm').textContent=msg;
  document.getElementById('cok').onclick=function(){if(best&&best.rs){D={v:8,rs:best.rs||[],ss:best.ss||[],cats:D.cats||{o:true,p:true,w:true,a:true},settings:D.settings||{nav:{o:true,p:true,w:true,a:true},homeCats:{o:true,p:true,w:true,a:true}}};sv();renderHome();cl('mc');st('\u5df2\u6062\u590d'+D.rs.length+'\u6761\u8bb0\u5f55')}else{st('\u65e0\u53ef\u6062\u590d\u6570\u636e')}};
  op('mc');
}
function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

renderNav();
renderHome();
</script>

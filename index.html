<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>微博记账</title>
<style>
:root{
  --p:#F2D7D9;--pl:#FCE4EC;--pd:#D484A9;
  --g:#66BB6A;--r:#EF5350;--b:#E0E0E0;
  --bg:#F8F7F5;--c:rgba(255,255,255,0.72);--c2:rgba(255,255,255,0.55);
  --t1:#333333;--t2:#888888;--t3:#AAAAAA;
  --line:rgba(255,255,255,0.25);
  --radius:32px;--radius-sm:24px;--radius-xs:20px;
  --shadow:0 8px 32px rgba(0,0,0,0.06);
  --glass:rgba(255,255,255,0.72);--glass-blur:blur(24px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--t1);font-size:15px;padding-bottom:90px;line-height:1.55;letter-spacing:0.01em}
h1,h2,h3{margin:0;font-weight:600}
input,select,textarea,button{font-family:inherit;font-size:15px;border:none;outline:none;width:100%;background:transparent}
textarea{resize:vertical;min-height:60px}
button{cursor:pointer;background:none;color:var(--t1)}

.pg{display:none;padding:20px 16px;max-width:600px;margin:0 auto;animation:fa .35s ease}
.pg.ac{display:block}
@keyframes fa{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

.gc{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.35);border-radius:var(--radius);padding:20px;margin-bottom:20px;box-shadow:0 8px 32px rgba(0,0,0,0.05);position:relative}
.gc::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);border-radius:var(--radius) var(--radius) 0 0;pointer-events:none}

.ov{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
.ov-c{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.35);border-radius:var(--radius);padding:18px 16px;box-shadow:0 8px 32px rgba(0,0,0,0.05);position:relative}
.ov-c::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.5),transparent);border-radius:var(--radius) var(--radius) 0 0;pointer-events:none}
.ov-t{font-size:12px;color:var(--t2);margin-bottom:6px;letter-spacing:0.03em}
.ov-v{font-size:24px;font-weight:700;color:var(--pd)}
.ov-v.g{color:var(--g)}.ov-v.r{color:var(--r)}

.act-w{display:flex;gap:10px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.act-w::-webkit-scrollbar{display:none}
.act-b{flex-shrink:0;padding:10px 18px;border-radius:40px;font-size:14px;font-weight:500;white-space:nowrap;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.35);color:var(--t1);box-shadow:0 4px 16px rgba(0,0,0,0.04);transition:.2s}
.act-b.pri{background:rgba(242,215,217,0.65);color:var(--pd);border-color:rgba(242,215,217,0.5)}

.cat-w{display:flex;gap:12px;margin-bottom:20px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-w::-webkit-scrollbar{display:none}
.cat-b{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 18px;border-radius:var(--radius-sm);background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.35);min-width:80px;box-shadow:0 4px 16px rgba(0,0,0,0.04);cursor:pointer;transition:.2s}
.cat-b .ic{font-size:24px}.cat-b .lb{font-size:12px;color:var(--t2);font-weight:500}

.period-w{display:flex;gap:8px;margin-bottom:16px}
.period-b{padding:6px 14px;border-radius:20px;font-size:13px;color:var(--t2);background:var(--c2);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.3);cursor:pointer;transition:.2s}
.period-b.ac{background:rgba(242,215,217,0.6);color:var(--pd);border-color:rgba(242,215,217,0.5)}

/* home card: left image square, right content */
.hc{display:flex;align-items:flex-start;gap:14px;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.35);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,0.04);cursor:pointer;position:relative;transition:transform .2s}
.hc:active{transform:scale(0.98)}
.hc-img{width:72px;height:72px;border-radius:var(--radius-sm);object-fit:cover;background:rgba(252,228,236,0.5);display:flex;align-items:center;justify-content:center;font-size:26px;flex-shrink:0;overflow:hidden}
.hc-img img{width:100%;height:100%;object-fit:cover}
.hc-body{flex:1;min-width:0}
.hc-name{font-size:17px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-sub{font-size:14px;color:var(--t2);margin-bottom:6px}
.hc-pl{font-size:16px;font-weight:700}
.hc-pl.r{color:var(--r)}.hc-pl.g{color:var(--g)}
.hc-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:2px}
.hc-nw{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.hc-name2{font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hc-tags2{display:flex;gap:5px;flex-shrink:0}
.hc-tag2{font-size:12px;padding:2px 8px;border-radius:10px;background:rgba(252,228,236,0.7);color:var(--pd);font-weight:500;white-space:nowrap}
.hc-act{display:flex;gap:8px;margin-top:10px}
.hc-act button{flex:1;padding:8px;border-radius:var(--radius-xs);font-size:13px;background:var(--c2);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.3);color:var(--t1);font-weight:500}
.hc-act{display:flex;gap:8px;margin-top:10px}
.hc-act button{flex:1;padding:8px;border-radius:var(--radius-xs);font-size:13px;background:var(--c2);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.3);color:var(--t1);font-weight:500}
.hc-act button:first-child{color:var(--pd);border-color:rgba(242,215,217,0.5);background:rgba(242,215,217,0.2)}
.hc-act button.s{color:#66BB6A;border-color:rgba(102,187,106,0.4);background:rgba(102,187,106,0.1)}
.hc-act button.d{color:var(--r);border-color:rgba(239,83,80,0.3);background:rgba(239,83,80,0.08)}

/* list view */
.lr{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--c2);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.45);border-radius:var(--radius-sm);margin-bottom:10px}
.lr-img{width:48px;height:48px;border-radius:10px;overflow:hidden;background:rgba(252,228,236,0.5);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.lr-img img{width:100%;height:100%;object-fit:cover}
.lr-body{flex:1;min-width:0}
.lr-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lr-sub{font-size:13px;color:var(--t2);margin-top:2px}
.lr-pl{font-size:15px;font-weight:700;white-space:nowrap}
.lr-pl.r{color:var(--r)}.lr-pl.g{color:var(--g)}

/* grid view */
.grw{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.gr{background:var(--c2);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.45);border-radius:var(--radius-sm);padding:12px;display:flex;flex-direction:column}
.gr-img{width:100%;aspect-ratio:1;border-radius:10px;overflow:hidden;background:rgba(252,228,236,0.5);display:flex;align-items:center;justify-content:center;margin-bottom:10px}
.gr-img img{width:100%;height:100%;object-fit:cover}
.gr-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.gr-sub{font-size:13px;color:var(--t2);margin-bottom:6px}
.gr-pl{font-size:16px;font-weight:700}
.gr-pl.r{color:var(--r)}.gr-pl.g{color:var(--g)}

.iqr{display:flex;align-items:center;gap:8px;padding:8px 10px;background:rgba(248,247,245,0.6);border-radius:var(--radius-sm);border:1px solid rgba(255,255,255,0.4)}
.iql{font-size:14px;font-weight:500;min-width:40px}
.iqrem{font-size:12px;color:var(--t3);margin-right:auto}
.iqq{width:48px;text-align:center;border:1px solid rgba(255,255,255,0.5);border-radius:8px;padding:5px;font-size:14px;background:rgba(255,255,255,0.6)}

.avg{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.avc{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.35);border-radius:var(--radius);padding:12px;text-align:center;cursor:pointer;box-shadow:0 4px 20px rgba(0,0,0,0.04);transition:transform .2s}
.avc:active{transform:scale(0.97)}
.avimg{height:80px;border-radius:var(--radius-sm);background:rgba(252,228,236,0.4);display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:10px;overflow:hidden}
.avimg img{width:100%;height:100%;object-fit:cover}
.avn{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avp{font-size:12px;color:var(--pd);margin-top:3px;font-weight:500}

.det-h{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.35);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 4px 20px rgba(0,0,0,0.04)}
.detsec{background:rgba(248,247,245,0.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,0.3);border-radius:var(--radius-sm);padding:14px;margin-top:12px}

.fg{margin-bottom:14px}
.fg label{display:block;font-size:13px;color:var(--t2);margin-bottom:8px;font-weight:500;letter-spacing:0.02em}
.fg input,.fg select,.fg textarea{background:var(--c2);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.35);border-radius:var(--radius-xs);padding:12px 14px;font-size:15px;color:var(--t1);transition:.2s;width:100%}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--pd);box-shadow:0 0 0 3px rgba(242,215,217,0.3)}
.fg textarea{min-height:64px;resize:vertical}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bt{padding:13px 20px;border-radius:var(--radius-sm);font-weight:600;font-size:15px;text-align:center;transition:transform .15s,box-shadow .15s;letter-spacing:0.02em}
.bt:active{transform:scale(0.97)}
.bp{background:rgba(242,215,217,0.75);color:var(--pd);border:1px solid rgba(242,215,217,0.5);box-shadow:0 4px 16px rgba(242,215,217,0.3)}
.bg{background:var(--c2);color:var(--t1);border:1px solid rgba(255,255,255,0.35);backdrop-filter:blur(12px)}
.bd{background:rgba(239,83,80,0.15);color:var(--r);border:1px solid rgba(239,83,80,0.3)}

/* edit modal image preview square on top */
.edit-img-row{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.edit-img-preview{width:80px;height:80px;border-radius:var(--radius-sm);background:rgba(252,228,236,0.5);display:flex;align-items:center;justify-content:center;font-size:28px;flex-shrink:0;overflow:hidden;cursor:pointer;position:relative;border:1px solid rgba(255,255,255,0.35)}
.edit-img-preview img{width:100%;height:100%;object-fit:cover}
.edit-img-preview .img-u-r{position:absolute;top:4px;right:4px;background:rgba(0,0,0,0.4);color:#fff;border:none;border-radius:50%;width:24px;height:24px;font-size:13px;z-index:2;backdrop-filter:blur(8px);cursor:pointer}

.img-u{height:120px;border:2px dashed rgba(212,132,169,0.4);border-radius:var(--radius-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--t2);cursor:pointer;position:relative;overflow:hidden;background:rgba(252,228,236,0.3);transition:.2s}
.img-u.has-img{border-style:solid;border-color:rgba(242,215,217,0.5);background:var(--c)}
.img-u img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.img-u-r{position:absolute;top:6px;right:6px;background:rgba(0,0,0,0.4);color:#fff;border:none;border-radius:50%;width:28px;height:28px;font-size:15px;z-index:2;backdrop-filter:blur(8px);cursor:pointer}

.fl-i{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,0.3)}
.fl-n{font-size:14px;font-weight:500}.fl-d{font-size:12px;color:var(--t2);margin-top:3px}
.fl-v{font-size:15px;font-weight:700}.fl-v.g{color:var(--g)}.fl-v.r{color:var(--r)}

/* bottom nav: text only, bold */
.bn{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:center;align-items:center;background:rgba(255,255,255,0.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.4);border-radius:var(--radius);padding:10px 6px calc(10px + env(safe-area-inset-bottom) / 2);z-index:50;box-shadow:0 8px 40px rgba(0,0,0,0.08)}
.bi{flex:1;padding:8px 2px;background:none;border:none;color:var(--t2);font-size:13px;cursor:pointer;border-radius:16px;transition:.2s;min-width:0;font-weight:600;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.bi.ac{color:var(--pd)}
.naf{width:44px;height:44px;border-radius:50%;background:rgba(242,215,217,0.85);color:var(--pd);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 4px 20px rgba(242,215,217,0.4);transition:transform .15s;font-weight:400}
.naf:active{transform:scale(0.93)}

.mo{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.2);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
.mo.ac{display:flex}
.md{background:rgba(255,255,255,0.88);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border:1px solid rgba(255,255,255,0.45);border-radius:var(--radius) var(--radius) 0 0;padding:24px 20px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;animation:bu .35s ease;box-shadow:0 -8px 40px rgba(0,0,0,0.08)}
@keyframes bu{from{transform:translateY(100%)}to{transform:translateY(0)}}
.md h3{text-align:center;margin-bottom:18px;color:var(--pd);font-size:18px;font-weight:600}

.st-i{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.35);border-radius:var(--radius-sm);margin-bottom:12px;box-shadow:0 4px 16px rgba(0,0,0,0.04)}
.st-t{font-size:15px;font-weight:500;color:var(--t1)}.st-d{font-size:12px;color:var(--t2);margin-top:3px}

.tg{width:52px;height:30px;border-radius:15px;background:rgba(224,224,224,0.7);position:relative;cursor:pointer;transition:.25s;flex-shrink:0;border:1px solid rgba(255,255,255,0.3)}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,0.15)}
.tg.on{background:rgba(242,215,217,0.8);border-color:rgba(242,215,217,0.5)}
.tg.on::after{left:23px;background:var(--pd)}

.empty{text-align:center;padding:48px 20px;color:var(--t3);font-size:14px;letter-spacing:0.02em}

#to{position:fixed;top:24px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.75);backdrop-filter:blur(12px);color:#fff;padding:10px 22px;border-radius:24px;font-size:14px;z-index:200;opacity:0;transition:.3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.15)}
#to.sw{opacity:1}

.stats-g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px}
.stats-c{background:var(--glass);backdrop-filter:var(--glass-blur);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,0.35);border-radius:var(--radius-sm);padding:16px;box-shadow:0 4px 16px rgba(0,0,0,0.04)}
.stats-lb{font-size:12px;color:var(--t2);margin-bottom:4px}.stats-v{font-size:20px;font-weight:700;color:var(--t1)}

.cat-tabs{display:flex;gap:8px;margin-bottom:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{padding:8px 16px;border-radius:20px;font-size:13px;color:var(--t2);background:var(--c2);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.3);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.2s}
.cat-tab.ac{background:rgba(242,215,217,0.6);color:var(--pd);border-color:rgba(242,215,217,0.5)}

.view-sw{display:flex;gap:6px;margin-bottom:16px}
.view-b{padding:6px 12px;border-radius:16px;font-size:13px;color:var(--t2);background:var(--c2);border:1px solid rgba(255,255,255,0.3);cursor:pointer;transition:.2s}
.view-b.ac{background:rgba(242,215,217,0.5);color:var(--pd)}

.quality-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:10px;background:rgba(248,247,245,0.8);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.3);border-radius:var(--radius-xs)}
.quality-row input{flex:1;padding:8px 10px;border:1px solid rgba(255,255,255,0.35);border-radius:10px;font-size:14px;background:var(--c2)}
.quality-row input[type=number]{width:60px;padding:8px 6px;text-align:center}
.qty-btn{width:32px;height:32px;border-radius:10px;background:rgba(242,215,217,0.3);color:var(--pd);border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.tl{position:relative;padding-left:24px}
.tl::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,rgba(242,215,217,0.6),rgba(242,215,217,0.1))}
.tl-i{position:relative;padding:14px 0 14px 16px}
.tl-i::before{content:"";position:absolute;left:-20px;top:18px;width:10px;height:10px;border-radius:50%;background:var(--p);border:2px solid #fff;box-shadow:0 2px 8px rgba(242,215,217,0.4)}
.tl-i .tl-t{font-size:12px;color:var(--t2);margin-bottom:4px}
.tl-i .tl-n{font-size:14px;font-weight:500}
.tl-i .tl-v{font-size:14px;font-weight:600;margin-top:3px}
.tl-i .tl-v.g{color:var(--g)}.tl-i .tl-v.r{color:var(--r)}

.hs{margin-bottom:16px}
.hs-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.hs-t{font-size:16px;font-weight:600}.hs-a{font-size:13px;color:var(--pd);cursor:pointer}

/* flow merged timeline */
.flow-hd{font-size:12px;color:var(--t2);margin:18px 0 8px;padding-left:8px;border-left:3px solid var(--p);font-weight:600}
</style>
</head>
<body>
<div id="to"></div>

<div class="pg ac" id="p-home">
  <div class="ov" id="ov"></div>
  <div class="period-w" id="period-w"></div>
  <div class="act-w" id="act-w"></div>
  <div class="cat-w" id="cat-w"></div>
  <div id="hc"></div>
</div>

<div class="pg" id="p-stats">
  <div style="font-size:18px;font-weight:600;margin-bottom:20px;color:var(--t1)">统计分析</div>
  <div class="stats-g" id="stats-overview"></div>
  <div id="stats-detail"></div>
</div>

<div class="pg" id="p-cat">
  <div class="cat-tabs" id="cat-tabs"></div>
  <div class="view-sw" id="view-sw"></div>
  <div id="cl"></div>
</div>

<div class="pg" id="p-detail">
  <div id="db"></div>
  <div style="display:flex;gap:10px;margin-top:14px" id="dac"></div>
</div>

<div class="pg" id="p-sell">
  <div style="font-size:13px;color:var(--t2);margin-bottom:14px">选择要卖出的藏品和数量</div>
  <form onsubmit="sv2(event)">
    <div class="fg"><label>选择记录 *</label><select id="ssr" required onchange="ssc()"><option value="">请选择...</option></select></div>

</div>

<div class="bn" id="nav"></div>

<script>
const K='wb_ornament_v8';
let D=ld(),CID=null,TEMP_IMG='',CAT='o';

function ld(){
  try{var d=JSON.parse(localStorage.getItem(K));if(d&&d.v>=8)return d;}
  catch(e){}
  var migrations=['wb_ornament_v7','wb_ornament_v6','wb_ornament_v5','wb_ornament_v4'];
  for(var mi=0;mi<migrations.length;mi++){
    try{
      var old=JSON.parse(localStorage.getItem(migrations[mi]));
      if(old&&old.rs){
        var nd={v:8,rs:old.rs||[],ss:old.ss||[],
          cats:old.cats||{o:true,p:true,w:true,a:true},
          settings:old.settings||{nav:{o:true,p:true,w:true,a:true},homeCats:{o:true,p:true,w:true,a:true}}};
        localStorage.setItem(K,JSON.stringify(nd));
        return nd;
      }
    }catch(e){}
  }
  return{v:8,rs:[],ss:[],cats:{o:true,p:true,w:true,a:true},
    settings:{nav:{o:true,p:true,w:true,a:true},homeCats:{o:true,p:true,w:true,a:true}}};
}
function sv(){D.v=8;localStorage.setItem(K,JSON.stringify(D))}
function today(){return new Date().toISOString().slice(0,10)}

function st(msg){var t=document.getElementById('to');t.textContent=msg;t.classList.add('sw');setTimeout(function(){t.classList.remove('sw')},2000)}
function op(id){document.getElementById(id).classList.add('ac')}
function cl(id){document.getElementById(id).classList.remove('ac')}
function clSell(){document.getElementById('bb-sell').style.display='none'}

function sp(p,cat){
  document.querySelectorAll('.pg').forEach(function(x){x.classList.remove('ac')});
  var pg=document.getElementById('p-'+p);
  if(pg)pg.classList.add('ac');
  document.querySelectorAll('.bi').forEach(function(x){x.classList.remove('ac')});
  if(p==='home')renderHome();
  else if(p==='stats')renderStats();
  else if(p==='cat'){CAT=cat||'o';renderCat();}
  else if(p==='sell')rsf();
  else if(p==='flow')rf();
  else if(p==='settings')renderSettings();
  updateNavActive();
}

function updateNavActive(){
  var curPage=document.querySelector('.pg.ac');
  if(!curPage)return;
  var pid=curPage.id.replace('p-','');
  document.querySelectorAll('.bi').forEach(function(b){
    var bp=b.dataset.p;
    if(bp===pid){
      if(pid==='cat'){
        if(b.dataset.cat===CAT)b.classList.add('ac');
      }else{
        b.classList.add('ac');
      }
    }
  });
}

function renderNav(){
  var nav=document.getElementById('nav');
  var html='';
  html+='<button class="bi" data-p="home" onclick="sp(\'home\')">首页</button>';
  html+='<button class="bi" data-p="stats" onclick="sp(\'stats\')">统计</button>';
  html+='<button class="bi" onclick="op(\'ma\');document.getElementById(\'at\').value=\'o\';atc()"><span class="naf">＋</span></button>';
  html+='<button class="bi" data-p="flow" onclick="sp(\'flow\')">流水</button>';
  html+='<button class="bi" data-p="settings" onclick="sp(\'settings\')">设置</button>';
  nav.innerHTML=html;
  updateNavActive();
}

var HF_PERIOD='all';
function renderHome(){
  var now=new Date();
  var y=now.getFullYear(),m=now.getMonth()+1;
  var lm=m===1?12:m-1,ly=m===1?y-1:y;
  var thisMonthStr=y+'-'+(m<10?'0':'')+m;
  var lastMonthStr=ly+'-'+(lm<10?'0':'')+lm;
  var thisYearStr=String(y);
  function periodFilter(d){
    if(HF_PERIOD==='all')return true;
    if(HF_PERIOD==='thisMonth')return d.slice(0,7)===thisMonthStr;
    if(HF_PERIOD==='lastMonth')return d.slice(0,7)===lastMonthStr;
    if(HF_PERIOD==='thisYear')return d.slice(0,4)===thisYearStr;
    return true;
  }
  var filteredRs=(D.rs||[]).filter(function(r){return periodFilter(r.d||'')});
  var filteredSs=(D.ss||[]).filter(function(s){return periodFilter(s.d||'')});
  var totalInvest=0,totalRecover=0;
  filteredRs.forEach(function(r){
    if(r.t==='o'||r.t==='p')totalInvest+=r.tc||0;
    else if(r.t==='w')totalInvest+=r.pr||0;
    else if(r.t==='a')(r.is||[]).forEach(function(i){totalInvest+=i.p||0});
  });
  filteredSs.forEach(function(s){totalRecover+=s.tp||0});
  var profit=totalRecover-totalInvest;
  document.getElementById('ov').innerHTML=
    '<div class="ov-c"><div class="ov-t">总支出</div><div class="ov-v r">\u00a5'+(totalInvest||0).toFixed(2)+'</div></div>'+
    '<div class="ov-c"><div class="ov-t">总收入</div><div class="ov-v g">\u00a5'+(totalRecover||0).toFixed(2)+'</div></div>'+
    '<div class="ov-c"><div class="ov-t">净盈亏</div><div class="ov-v '+(profit>=0?'g':'r')+'">'+(profit>=0?'+':'')+'\u00a5'+(profit||0).toFixed(2)+'</div></div>'+
    '<div class="ov-c"><div class="ov-t">记录数</div><div class="ov-v">'+filteredRs.length+' 条</div></div>';

  var periods=[{k:'all',n:'全部'},{k:'thisMonth',n:'本月'},{k:'lastMonth',n:'上月'},{k:'thisYear',n:'今年'}];
  document.getElementById('period-w').innerHTML=periods.map(function(p){
    return '<button class="period-b'+(HF_PERIOD===p.k?' ac':'')+'" onclick="HF_PERIOD=\''+p.k+'\';renderHome()">'+p.n+'</button>';
  }).join('');

  document.getElementById('act-w').innerHTML=
    '<button class="act-b pri" onclick="op(\'ma\');document.getElementById(\'at\').value=\'o\';atc()" style="color:var(--pd)">\uff0b 记支出</button>'+
    '<button class="act-b" onclick="openIncome()" style="color:var(--g);background:rgba(102,187,106,0.12);border-color:rgba(102,187,106,0.3)">\uff0b 记收入</button>'+
    '<button class="act-b" onclick="sp(\'flow\')">流水</button>'+
    '<button class="act-b" onclick="sp(\'settings\')">设置</button>';

  var homeCats=D.settings.homeCats||{o:true,p:true,w:true,a:true};
  var catNames2={o:'微博装扮',p:'个性装扮',w:'福利赏',a:'六边形头像'};
  var catHtml='';
  ['o','p','w','a'].forEach(function(c){
    if(homeCats[c]){
      var cnt=(D.rs||[]).filter(function(r){return r.t===c}).length;
      catHtml+='<div class="cat-b" onclick="sp(\'cat\',\''+c+'\')"><div class="lb">'+catNames2[c]+'</div><div style="font-size:11px;color:var(--t3)">'+cnt+'条</div></div>';
    }
  });
  document.getElementById('cat-w').innerHTML=catHtml||'<div style="font-size:14px;color:var(--t3);padding:10px 0">\u6682\u65e0\u5206\u7c7b\u5feb\u6377\u5165\u53e3\uff0c\u8bf7\u5728\u8bbe\u7f6e\u4e2d\u5f00\u542f</div>';

  var catNames3={o:'微博装扮',p:'个性装扮',w:'福利赏',a:'六边形头像'};
  var html='';
  ['o','p','w','a'].forEach(function(ck){
    if(!homeCats[ck])return;
    var list=filteredRs.filter(function(r){return r.t===ck});
    if(list.length===0)return;
    html+='<div style="margin-bottom:20px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><div style="font-size:16px;font-weight:600;color:var(--t1)">'+catNames3[ck]+'</div><div style="font-size:13px;color:var(--pd);cursor:pointer" onclick="sp(\'cat\',\''+ck+'\')">\u67e5\u770b\u5168\u90e8 ></div></div>';
    if(ck==='a'){
      html+='<div class="avg">';
      list.slice(0,3).forEach(function(r){
        html+='<div class="avc" style="position:relative" onclick="od(\''+r.id+'\')">'+
          '<div class="avimg">'+(r.img?'<img src="'+esc(r.img)+'">':'')+'</div>'+
          '<div class="avn">'+esc(r.n||'\u672a\u547d\u540d')+'</div>'+
          '<div class="avp">'+(r.is||[]).length+'\u4e2a \u00b7 \u00a5'+(r.is||[]).reduce(function(s,i){return s+i.p},0).toFixed(2)+'</div></div>';
      });
      html+='</div>';
    }else{
      list.slice(0,2).forEach(function(r){html+=renderHomeCard(r,filteredSs)});
    }
    html+='</div>';
  });
  if(!html)html='<div class="empty">\u6682\u65e0\u8bb0\u5f55\uff0c\u70b9\u51fb\u300c\u8bb0\u4e00\u7b14\u300d\u6dfb\u52a0</div>';
  document.getElementById('hc').innerHTML=html;
}

function getQualityLabel(k){
  var map={p:'\u666e\u901a',x:'\u7a00\u6709',y:'\u9690\u85cf',s:'\u8d85\u795e',n:'\u666e\u901a',r:'\u7a00\u6709',h:'\u9690\u85cf',l:'\u8d85\u795e'};
  return map[k]||k;
}

function getSoldAmount(rid,ss){
  var amt=0;
  (ss||D.ss||[]).forEach(function(s){if(s.rid===rid)amt+=s.tp||0});
  return amt;
}

function renderHomeCard(r,ss){
  var imgHtml='';
  if(r.img)imgHtml='<img src="'+esc(r.img)+'">';
  else imgHtml='';

  var sub='\u603b\u652f\u51fa \u00a5'+(r.tc||0).toFixed(2);
  var soldAmt=getSoldAmount(r.id,ss);
  var pl=soldAmt-(r.tc||0);
  var plText=(pl>=0?'+':'')+'\u00a5'+pl.toFixed(2);
  var plClass=pl>=0?'g':'r';

  var tags2='';
  if(r.ts&&r.ts.length>0){
    var tagParts=[];
    r.ts.forEach(function(t){
      if((t.c||0)>0)tagParts.push(getQualityLabel(t.k||t.n)+' '+(t.c||0));
    });
    if(tagParts.length>0){
      tags2='<div class="hc-tags2">'+tagParts.map(function(t){return '<span class="hc-tag2">'+esc(t)+'</span>'}).join('')+'</div>';
    }
  }

  return '<div class="hc" onclick="od(\''+r.id+'\')">'+
    '<div class="hc-img">'+imgHtml+'</div>'+
    '<div class="hc-body">'+
      '<div class="hc-hd">'+
        '<div class="hc-nw">'+
          '<div class="hc-name2">'+esc(r.n)+'</div>'+tags2+'</div>'+
        '<div class="hc-pl '+plClass+'">'+plText+'</div></div>'+
      '<div class="hc-sub">'+sub+'</div>'+
      '<div class="hc-act" onclick="event.stopPropagation()">'+
        '<button onclick="er(\''+r.id+'\')">\u7f16\u8f91</button>'+
        '<button class="s" onclick="selFromCard(\''+r.id+'\')">\u5356\u51fa</button>'+
        '<button class="d" onclick="dr(\''+r.id+'\')">\u5220\u9664</button></div></div></div>';
}

function renderCard(r){
  return renderHomeCard(r);
}

function renderStats(){
  var cats=['o','p','w','a'];
  var catNames={o:'\u5fae\u535a\u88c5\u626e',p:'\u4e2a\u6027\u88c5\u626e',w:'\u798f\u5229\u8d4f',a:'\u516d\u8fb9\u5f62\u5934\u50cf'};
  var totalInvest=0,totalRecover=0,totalRemain=0;
  (D.rs||[]).forEach(function(r){
    if(r.t==='o'||r.t==='p'){totalInvest+=r.tc||0;totalRemain+=(r.ts||[]).reduce(function(s,t){return s+t.c},0)}
    else if(r.t==='w')totalInvest+=r.pr||0;
    else if(r.t==='a'){(r.is||[]).forEach(function(i){totalInvest+=i.p||0;if(!i._sold)totalRemain++})}
  });
  (D.ss||[]).forEach(function(s){totalRecover+=s.tp||0});
  document.getElementById('stats-overview').innerHTML=
    '<div class="stats-c"><div class="stats-lb">\u603b\u652f\u51fa</div><div class="stats-v r">\u00a5'+(totalInvest||0).toFixed(2)+'</div></div>'+
    '<div class="stats-c"><div class="stats-lb">\u603b\u6536\u5165</div><div class="stats-v g">\u00a5'+(totalRecover||0).toFixed(2)+'</div></div>'+
    '<div class="stats-c"><div class="stats-lb">\u5269\u4f59\u5e93\u5b58</div><div class="stats-v">'+totalRemain+' \u4ef6</div></div>'+
    '<div class="stats-c"><div class="stats-lb">\u51c0\u76c8\u4e8f</div><div class="stats-v '+(totalRecover-totalInvest>=0?'g':'r')+'">'+(totalRecover-totalInvest>=0?'+':'')+'\u00a5'+(totalRecover-totalInvest).toFixed(2)+'</div></div>';

  var detailHtml='';
  cats.forEach(function(c){
    var rs2=(D.rs||[]).filter(function(r){return r.t===c});
    if(rs2.length===0)return;
    var catInvest=0,catRemain=0,catRecoverable=0;
    rs2.forEach(function(r){
      if(r.t==='o'||r.t==='p'){catInvest+=r.tc||0;catRemain+=(r.ts||[]).reduce(function(s,t){return s+t.c},0)}
      else if(r.t==='w')catInvest+=r.pr||0;
      else if(r.t==='a'){(r.is||[]).forEach(function(i){catInvest+=i.p||0;if(!i._sold)catRemain++})}
    });
    (D.ss||[]).forEach(function(s){
      var r2=D.rs.find(function(x){return x.id===s.rid});
      if(r2&&r2.t===c)catRecoverable+=s.tp||0;
    });
    detailHtml+='<div class="gc" style="margin-bottom:14px"><div style="font-size:15px;font-weight:600;margin-bottom:10px">'+catNames[c]+'</div>'+
      '<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">'+
      '<div><div class="stats-lb">\u652f\u51fa</div><div class="stats-v r" style="font-size:16px">\u00a5'+catInvest.toFixed(2)+'</div></div>'+
      '<div><div class="stats-lb">\u6536\u5165</div><div class="stats-v g" style="font-size:16px">\u00a5'+catRecoverable.toFixed(2)+'</div></div>'+
      '<div><div class="stats-lb">\u5269\u4f59</div><div class="stats-v" style="font-size:16px">'+catRemain+'\u4ef6</div></div>'+
      '</div></div>';
  });
  document.getElementById('stats-detail').innerHTML=detailHtml||'<div class="empty">\u6682\u65e0\u6570\u636e</div>';
}

var CAT_VIEW={};
function renderCat(){
  var catNames={o:'\u5fae\u535a\u88c5\u626e',p:'\u4e2a\u6027\u88c5\u626e',w:'\u798f\u5229\u8d4f',a:'\u516d\u8fb9\u5f62\u5934\u50cf'};
  document.getElementById('cat-tabs').innerHTML=['o','p','w','a'].map(function(c){
    return '<button class="cat-tab'+(CAT===c?' ac':'')+'" onclick="CAT=\''+c+'\';renderCat()">'+catNames[c]+'</button>';
  }).join('');
  var view=CAT_VIEW[CAT]||'card';
  document.getElementById('view-sw').innerHTML=
    '<button class="view-b'+(view==='card'?' ac':'')+'" onclick="setCatView(\'card\')">\u5361\u7247</button>'+
    '<button class="view-b'+(view==='list'?' ac':'')+'" onclick="setCatView(\'list\')">\u5217\u8868</button>'+
    '<button class="view-b'+(view==='grid'?' ac':'')+'" onclick="setCatView(\'grid\')">\u7f51\u683c</button>';
  var list=(D.rs||[]).filter(function(r){return r.t===CAT});
  var cl=document.getElementById('cl');
  if(list.length===0){cl.innerHTML='<div class="empty">\u6682\u65e0\u8bb0\u5f55</div>';return}
  if(view==='list'){
    cl.innerHTML=list.map(function(r){return renderListRow(r)}).join('');
  }else if(view==='grid'){
    if(CAT==='a'){

    st('\u4fee\u6539\u6210\u529f');
  }else if(r.t==='w'){
    r.v=document.getElementById('ewv').value;
    r.pr=parseFloat(document.getElementById('ewp').value)||0;
    r.n='\u798f\u5229\u8d4f '+r.v;
    r.img=TEMP_IMG||r.img;
    r.rm=document.getElementById('erm').value;
    st('\u4fee\u6539\u6210\u529f');
  }else if(r.t==='a'){
    r.ar=document.getElementById('ear').value.trim();
    r.n=r.ar||'\u672a\u547d\u540d';
    r.is=[];
    var eil=document.getElementById('eil');
    if(eil&&eil.children)for(var ei=0;ei<eil.children.length;ei++){
      var row=eil.children[ei];
      var inputs=row.querySelectorAll?row.querySelectorAll('input'):[];
      if(inputs[0]&&inputs[0].value.trim())r.is.push({n:inputs[0].value.trim(),p:parseFloat(inputs[1].value)||0})
    }
    r.img=TEMP_IMG||r.img;
    r.rm=document.getElementById('erm').value;
    st('\u4fee\u6539\u6210\u529f');
  }
  TEMP_IMG='';sv();cl('me');renderHome();
}

  else if(r.ts){r.ts.forEach(function(t){st.innerHTML+='<option value="'+esc(t.k)+'">'+esc(getQualityLabel(t.k||t.n))+' (\u5269\u4f59'+(t.c||0)+'\u4ef6)</option>'})}

function stc(){
  var rid=document.getElementById('ssr').value;
  var tk=document.getElementById('st').value;
  if(!rid||!tk){document.getElementById('ssu').style.display='none';return}
  var r=D.rs.find(function(x){return x.id===rid});
  if(!r)return;
  document.getElementById('ssu').style.display='block';
  var name='',info='';
  if(r.t==='a'){var i=(r.is||[])[parseInt(tk)];if(i){name=i.n;info='\u00a5'+i.p.toFixed(2)}}
  else{var t=(r.ts||[]).find(function(x){return x.k===tk});if(t){name=getQualityLabel(t.k||t.n);var cpu=0;if(r.tc>0&&r.ts.reduce(function(s,x){return s+x.c},0)>0)cpu=(r.tc/r.ts.reduce(function(s,x){return s+x.c},0)).toFixed(2);info='\u5269\u4f59'+(t.c||0)+'\u4ef6 \u00b7 \u6210\u672c\u7ea6\u00a5'+cpu+'/\u4ef6'}}
  document.getElementById('ssn').textContent=name;
  document.getElementById('ssi').textContent=info;
  stp();
}
function stp(){
  var rid=document.getElementById('ssr').value;
  var tk=document.getElementById('st').value;
  var q=parseInt(document.getElementById('sq').value)||1;
  var tp=parseFloat(document.getElementById('spt').value)||0;
  document.getElementById('sbt').disabled=!(rid&&tk&&tp>0);
  if(rid&&tk&&tp>0){
    var r=D.rs.find(function(x){return x.id===rid});
    var cost=0;
    if(r.t==='a'){var i=(r.is||[])[parseInt(tk)];if(i)cost=i.p*q}
    else{var t=(r.ts||[]).find(function(x){return x.k===tk});if(t&&r.tc>0){var ti2=r.ts.reduce(function(s,x){return s+x.c},0)||1;cost=(r.tc/ti2)*q}}
    var profit=tp-cost;
    document.getElementById('spb').style.display='block';
    var pe=document.getElementById('spv');
    pe.textContent=(profit>=0?'+':'')+'\u00a5'+profit.toFixed(2);
    pe.style.color=profit>=0?'var(--g)':'var(--r)';
  }else{document.getElementById('spb').style.display='none'}
}

function irc(){
  var rid=document.getElementById('ir').value;
  var iqs=document.getElementById('iqs');
  var iqg=document.getElementById('iqg');
  if(!rid){iqs.style.display='none';iqg.innerHTML='';return}
  var r=D.rs.find(function(x){return x.id===rid});
  if(!r){iqs.style.display='none';iqg.innerHTML='';return}
  var items=[];
  // 从 ts 获取品质数据；没有 ts 则根据类型生成默认四品质
  if(r.ts&&r.ts.length>0){
    items=r.ts.map(function(t){return{k:t.k||t.n,n:getQualityLabel(t.k||t.n),c:t.c||0}});
  }else if(r.t==='o'||r.t==='p'){
    items=[{k:'p',n:'\u666e\u901a',c:0},{k:'x',n:'\u7a00\u6709',c:0},{k:'y',n:'\u9690\u85cf',c:0},{k:'s',n:'\u8d85\u795e',c:0}];
  }else if(r.t==='w'){
    items=[{k:'w',n:'\u798f\u5229\u8d4f',c:1}];
  }else if(r.t==='a'){
    items=(r.is||[]).map(function(i,idx){return{k:'a'+idx,n:i.n||('\u5934\u50cf'+(idx+1)),c:1}});
  }
  if(items.length===0){iqs.style.display='none';iqg.innerHTML='';return}
  var h='';
  items.forEach(function(t){
    var remain=t.c||0;
    h+='<div class="iqr"><span class="iql">'+esc(t.n)+'</span><span class="iqrem">剩'+remain+'件</span>'+
      '<button class="qty-btn" onclick="var inp=this.nextElementSibling;inp.value=Math.max(0,+inp.value-1)" style="font-size:16px;padding:4px 10px">\u2212</button>'+
      '<input type="number" class="iqq" value="0" min="0" max="'+remain+'" data-k="'+esc(t.k||'')+'">'+
      '<button class="qty-btn" onclick="var inp=this.previousElementSibling;inp.value=Math.min(+inp.max,+inp.value+1)" style="font-size:16px;padding:4px 10px">\uff0b</button></div>';
  });
  iqg.innerHTML=h;
  iqs.style.display='block';
}
function saveIncome(){
  var rid=document.getElementById('ir').value;
  var amt=parseFloat(document.getElementById('iamt').value)||0;
  var d=document.getElementById('idt').value||today();
  if(!rid){st('\u8bf7\u9009\u62e9\u8bb0\u5f55');return}
  if(amt<=0){st('\u8bf7\u586b\u5199\u91d1\u989d');return}
  var r=D.rs.find(function(x){return x.id===rid});
  if(!r){st('\u8bb0\u5f55\u4e0d\u5b58\u5728');return}
  // \u6536\u96c6\u54c1\u8d28\u6570\u91cf
  var its=[],totalQ=0;
  var iqs=document.querySelectorAll('#iqg .iqq');
  iqs.forEach(function(inp){
    var q=parseInt(inp.value)||0;
    var k=inp.getAttribute('data-k')||'';
    if(q>0){its.push({k:k,q:q});totalQ+=q}
  });
  // 扣除库存：优先 ts，兜底处理无 ts 的 o/p/a 类型
  if(its.length>0){
    if(r.ts){
      its.forEach(function(item){
        var t=r.ts.find(function(x){return (x.k||x.n)===item.k});
        if(t){t.c=Math.max(0,(t.c||0)-item.q)}
      });
    }else if(r.is){
      // 头像类型：移除已卖出的项
      its.forEach(function(item){
        var idx=parseInt(item.k.replace('a',''));
        if(!isNaN(idx)&&idx>=0&&idx<r.is.length)r.is[idx]._sold=(r.is[idx]._sold||0)+item.q;
      });
    }
    // o/p 无 ts 时不做库存扣减，只记录卖出
  }
  D.ss=D.ss||[];
  D.ss.push({id:'s'+Date.now(),rid:rid,tk:'quick',tn:r.n||'\u672a\u77e5',q:totalQ||1,tp:amt,d:d,rm:document.getElementById('irm').value||'',ca:new Date().toISOString(),its:its});
  sv();cl('mi');st('\u6536\u5165\u5df2\u8bb0\u5f55');
  renderHome();
}
function sv2(e){
  e.preventDefault();
  var rid=document.getElementById('ssr').value;
  var tk=document.getElementById('st').value;
  var q=parseInt(document.getElementById('sq').value)||1;
  var tp=parseFloat(document.getElementById('spt').value)||0;
  var d=document.getElementById('sd').value||today();
  if(!rid||!tk||!tp){st('\u8bf7\u586b\u5199\u5b8c\u6574');return}
  var r=D.rs.find(function(x){return x.id===rid});
  if(r.t==='a'){
    var i=(r.is||[])[parseInt(tk)];
    if(i){i.sd=i.sd||[];i.sd.push({q:q,tp:tp,d:d});i.p=i.p||0}
  }else if(r.ts){
    var t=r.ts.find(function(x){return x.k===tk});
    if(t){if((t.c||0)<q){st('\u5e93\u5b58\u4e0d\u8db3\uff0c\u5269\u4f59'+t.c);return};t.c=(t.c||0)-q}
  }
  var tn='';
  if(r.t==='a'){var i2=(r.is||[])[parseInt(tk)];if(i2)tn=i2.n}
  else{var t2=(r.ts||[]).find(function(x){return x.k===tk});if(t2)tn=getQualityLabel(t2.k||t2.n)}
  D.ss=D.ss||[];
  D.ss.push({id:'s'+Date.now(),rid:rid,tk:tk,ii:r.t==='a'?parseInt(tk):undefined,tn:tn,q:q,tp:tp,d:d,rm:document.getElementById('srm').value||'',ca:new Date().toISOString()});
  sv();st('\u5356\u51fa\u6210\u529f');
  document.getElementById('p-sell').classList.remove('ac');
  document.getElementById('p-home').classList.add('ac');
  renderHome();
}

function rf(){
  var fm=document.getElementById('fm').value;
  // Build merged timeline of buy + sell
  var events=[];
  (D.rs||[]).forEach(function(r){
    if(!fm||(r.d||'').slice(0,7)===fm){
      events.push({time:r.ca||r.d||'',type:'buy',name:r.rm||r.n,date:r.d||'',cat:r.t,amount:-((r.t==='w'?r.pr:r.tc)||0)});
    }
  });
  (D.ss||[]).forEach(function(s){
    if(!fm||(s.d||'').slice(0,7)===fm){
      var r=D.rs.find(function(x){return x.id===s.rid});
      var cost=0;
      if(r){
        if(r.t==='a'){var i=(r.is||[])[s.ii];if(i)cost=i.p||0}
        else{var t=(r.ts||[]).find(function(x){return x.k===s.tk});if(t&&r.tc>0){var ti2=r.ts.reduce(function(sum,x){return sum+x.c},0)||1;cost=(r.tc/ti2)*(s.q||1)}}
      }
      events.push({time:s.ca||s.d||'',type:'sell',name:s.rm||s.tn||'',date:s.d||'',amount:s.tp||0,cost:cost,q:s.q||1});
    }
  });
  events.sort(function(a,b){return (b.time||'').localeCompare(a.time||'')});

  var html='';
  var lastDate='';
  events.forEach(function(ev){
    var d=(ev.time||'').slice(0,10);
    if(d!==lastDate){html+='<div class="flow-hd">'+d+'</div>';lastDate=d}
    if(ev.type==='buy'){
      html+='<div class="fl-i"><div><div class="fl-n" style="font-weight:700">'+esc(ev.name)+'</div><div class="fl-d">'+(ev.date||'')+'</div></div><div class="fl-v r" style="font-weight:700">\u652f\u51fa\u00a0\u00a0\u00a0\u00a5'+Math.abs(ev.amount).toFixed(2)+'</div></div>';
    }else{
      html+='<div class="fl-i"><div><div class="fl-n" style="font-weight:700">'+esc(ev.name)+'</div><div class="fl-d">'+(ev.date||'')+'</div></div><div class="fl-v g" style="font-weight:700">\u6536\u5165\u00a0\u00a0\u00a0\u00a5'+ev.amount.toFixed(2)+'</div></div>';
    }
  });
  document.getElementById('fl').innerHTML=html||'<div class="empty">\u6682\u65e0\u6d41\u6c34\u6570\u636e</div>';
}

function renderSettings(){
  var catNames={o:'\u5fae\u535a\u88c5\u626e',p:'\u4e2a\u6027\u88c5\u626e',w:'\u798f\u5229\u8d4f',a:'\u516d\u8fb9\u5f62\u5934\u50cf'};
  var homeCats=D.settings.homeCats||{o:true,p:true,w:true,a:true};

function ex(){

function im(e){
  var f=e.target.files[0];
  if(!f)return;
  var r=new FileReader();
  r.onload=function(ev){
    try{var d=JSON.parse(ev.target.result);if(d.rs){D=d;D.v=8;sv();renderHome();st('\u5bfc\u5165\u6210\u529f')}else{st('\u683c\u5f0f\u9519\u8bef')}}
    catch(err){st('\u6587\u4ef6\u8bfb\u53d6\u5931\u8d25')}
  };
  r.readAsText(f);e.target.value='';
}
function recover(){
  var found=[],best=null,bestSize=0;
  for(var i=0;i<localStorage.length;i++){
    var k=localStorage.key(i);
    if(!k)continue;
    if(/ornament|weibo|data/i.test(k)){
      try{var v=localStorage.getItem(k);var info={key:k,size:v.length};try{var p=JSON.parse(v);info.rs=(p.rs||[]).length;info.ss=(p.ss||[]).length;if(v.length>bestSize){bestSize=v.length;best=p}}catch(e){}found.push(info)}catch(e){}
    }
  }
  if(found.length===0){st('\u672a\u627e\u5230\u65e7\u6570\u636e');return}
  var msg='\u627e\u5230'+found.length+'\u4e2a\u6570\u636e\uff1a\n'+found.map(function(x){return x.key+' (\u8bb0\u5f55'+x.rs+'\u6761)'}).join('\n')+'\n\n\u5bfc\u5165\u6700\u5927\u7684\uff1f';
  document.getElementById('ct').textContent='\u6062\u590d\u6570\u636e';
  document.getElementById('cm').textContent=msg;
  document.getElementById('cok').onclick=function(){if(best&&best.rs){D={v:8,rs:best.rs||[],ss:best.ss||[],cats:D.cats||{o:true,p:true,w:true,a:true},settings:D.settings||{nav:{o:true,p:true,w:true,a:true},homeCats:{o:true,p:true,w:true,a:true}}};sv();renderHome();cl('mc');st('\u5df2\u6062\u590d'+D.rs.length+'\u6761\u8bb0\u5f55')}else{st('\u65e0\u53ef\u6062\u590d\u6570\u636e')}};
  op('mc');
}
function migrateV8(){
  var sources=['wb_ornament_v7','wb_ornament_v6','wb_ornament_v5','wb_ornament_v4'];
  var migrated=false;
  for(var mi=0;mi<sources.length;mi++){
    try{
      var raw=localStorage.getItem(sources[mi]);
      if(!raw)continue;
      var old=JSON.parse(raw);
      if(!old||!old.rs)continue;
      D={v:8,rs:old.rs||[],ss:old.ss||[],
        cats:old.cats||{o:true,p:true,w:true,a:true},
        settings:old.settings||{nav:{o:true,p:true,w:true,a:true},homeCats:{o:true,p:true,w:true,a:true}}};
      sv();
      migrated=true;
      st('\u5df2\u4ece '+sources[mi]+' \u8fc1\u79fb\u5230 v8\uff08'+D.rs.length+'\u6761\u8bb0\u5f55\uff09');
      renderHome();
      break;
    }catch(e){}
  }
  if(!migrated)st('\u672a\u627e\u5230\u53ef\u8fc1\u79fb\u7684\u6570\u636e');
}
function clearAll(){
  document.getElementById('ct').textContent='\u786e\u8ba4\u6e05\u7a7a';
  document.getElementById('cm').textContent='\u6e05\u7a7a\u6240\u6709\u6570\u636e\uff1f\u4e0d\u53ef\u64a4\u9500\uff01';
  document.getElementById('cok').onclick=function(){localStorage.removeItem(K);D={v:8,rs:[],ss:[],cats:{o:true,p:true,w:true,a:true},settings:{nav:{o:true,p:true,w:true,a:true},homeCats:{o:true,p:true,w:true,a:true}}};sv();renderHome();cl('mc');st('\u5df2\u6e05\u7a7a')};
  op('mc');
}

function esc(s){return s?String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'):''}

<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>微博记账APP</title><link rel="icon" href="apple-touch-icon.png" type="image/png"><link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180"><meta name="apple-mobile-web-app-title" content="微博记账APP"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><link rel="manifest" href="manifest.json"><style>:root{--pink:#d484a9;--pink-light:#fce4f0;--pink-mid:#f5d0e5;--pink-pale:#fdf2f8;--bg:#faf8f8;--card:#fff;--border:#ede0e5;--text:#3a3a3a;--text2:#8a7a80;--text3:#b5a5ac;--green:#6b9e7c;--red:#c4687a;--amber:#d4a76a;--blue:#7a9ec4}*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;font-size:14px;max-width:480;margin:0 auto;min-height:100dvh;padding-bottom:70}input,select,textarea,button{font-family:inherit;font-size:inherit}textarea{resize:none}.topbar{background:var(--card);padding:12px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}.topbar::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:repeating-linear-gradient(90deg,var(--pink-mid) 0,var(--pink-mid) 8px,transparent 8px,transparent 12px)}.topbar h1{font-size:16px;font-weight:600;color:var(--text)}.topbar .back{background:none;border:none;color:var(--pink);font-size:14px;cursor:pointer;padding:4px 8px}.topbar .actions{display:flex;gap:8px}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:10;padding:12px}.stat-card{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--border);box-shadow:0 2px 12px rgba(212,132,169,0.06)}.stat-card .label{font-size:12px;color:var(--text2);margin-bottom:4px}.stat-card .value{font-size:20;font-weight:700}.stat-card .value.green{color:var(--green)}.stat-card .value.red{color:var(--red)}.stat-card .value.blue{color:var(--blue)}.stat-card.wide{grid-column:span 2}.stat-card .tiers{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.tier-badge{padding:2px 8px;border-radius:10;font-size:11px;font-weight:500;display:inline-block}.tier-green{background:#eaf3ee;color:var(--green)}.tier-amber{background:#faf2e0;color:var(--amber)}.tier-blue{background:#e8f0f8;color:var(--blue)}.tier-red{background:#fce8ec;color:var(--red)}.section{padding:12px}.section-title{font-size:13px;color:var(--text2);margin-bottom:10;font-weight:500;display:flex;justify-content:space-between;align-items:center}.section-title .sub{font-size:12px;color:var(--text3);font-weight:400}.series-card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:10;border:1px solid var(--border);box-shadow:0 2px 8px rgba(212,132,169,0.04);cursor:pointer;transition:all 0.15s}.series-card:active{background:var(--pink-pale)}.series-card .sc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10}.series-card .sc-name{font-weight:600;font-size:15px}.series-card .sc-meta{font-size:12px;color:var(--text2);margin-top:2px}.series-card .sc-tiers{display:flex;gap:6px;flex-wrap:wrap}.series-card .sc-tier-item{display:flex;align-items:center;gap:4px;padding:4px 10;border-radius:10;background:var(--bg);font-size:12px}.series-card .sc-tier-item .t-name{color:var(--text2)}.series-card .sc-tier-item .t-count{font-weight:700;color:var(--text)}.form-group{margin-bottom:14px}.form-group label{display:block;font-size:13px;font-weight:500;margin-bottom:6px;color:var(--text2)}.form-group input,.form-group select,.form-group textarea{width:100%;padding:10 12px;border:1.5px solid var(--border);border-radius:12px;background:var(--card);font-size:14px;color:var(--text);outline:none;transition:border 0.15s}.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--pink)}.form-group textarea{height:60}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10}.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10 20;border-radius:12px;font-size:14px;font-weight:500;cursor:pointer;border:none;transition:opacity 0.15s}.btn:active{opacity:0.8}.btn-primary{background:var(--pink);color:#fff;box-shadow:0 2px 8px rgba(212,132,169,0.3)}.btn-danger{background:var(--red);color:#fff}.btn-ghost{background:var(--card);color:var(--text);border:1.5px solid var(--border)}.btn-block{width:100%}.count-stepper{display:flex;align-items:center;border:1.5px solid var(--border);border-radius:12px;overflow:hidden}.count-stepper button{width:40;height:40;border:none;background:var(--pink-pale);font-size:20;cursor:pointer;color:var(--pink)}.count-stepper button:active{background:var(--pink-light)}.count-stepper input{width:60;height:40;border:none;text-align:center;font-size:16px;font-weight:600;border-left:1.5px solid var(--border);border-right:1.5px solid var(--border);outline:none;background:var(--card)}.draw-tier-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}.draw-tier-row:last-child{border-bottom:none}.draw-tier-row .dtl-label{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480;background:var(--card);border-top:1px solid var(--border);display:flex;z-index:20}.nav-item{flex:1;padding:10 4px 22px;text-align:center;cursor:pointer;border:none;background:none;color:var(--text3);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color 0.15s;position:relative;-webkit-tap-highlight-color:transparent;touch-action:manipulation}.nav-item.active{color:var(--pink)}.nav-item svg{width:22px;height:22px}.nav-add-fixed{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:50;height:50;background:var(--pink);color:#fff;border-radius:50%;border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;z-index:25;box-shadow:0 4px 12px rgba(212,132,169,0.4);-webkit-tap-highlight-color:transparent;touch-action:manipulation;cursor:pointer;padding:0}.nav-item-spacer{pointer-events:none;opacity:0}.page{display:none}.page.active{display:block}.flow-item{background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;box-shadow:0 1px 6px rgba(212,132,169,0.04)}.flow-item .flow-left{display:flex;flex-direction:column;gap:3px}.flow-item .flow-name{font-weight:500;font-size:14px}.flow-item .flow-time{font-size:12px;color:var(--text3)}.flow-item .flow-right{text-align:right}.flow-item .flow-amount{font-weight:600;font-size:15px}.flow-item .flow-amount.income{color:var(--green)}.flow-item .flow-amount.expense{color:var(--red)}.modal-overlay{position:fixed;inset:0;background:rgba(58,58,58,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}.modal-overlay.active{display:flex}.modal{background:var(--card);border-radius:20 20 0 0;width:100%;max-width:480;max-height:90dvh;overflow-y:auto;padding:20;padding-bottom:max(20,env(safe-area-inset-bottom));animation:slideUp 0.2s ease;-webkit-overflow-scrolling:touch}@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}.modal h3{font-size:16px;font-weight:600;margin-bottom:16px;text-align:center;color:var(--text)}.modal .modal-actions{display:flex;gap:10;margin-top:16px}.modal .modal-actions .btn{flex:1}.settings-item{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:8px;border:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background 0.15s}.settings-item:active{background:var(--pink-pale)}.settings-item .si-label{font-size:14px}.settings-item .si-value{color:var(--text2);font-size:13px}.settings-item .si-arrow{color:var(--text3)}.empty{text-align:center;padding:40 20;color:var(--text3)}.empty-icon{font-size:48px;margin-bottom:12px}.empty p{font-size:14px}.month-filter{padding:8px 12px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10;overflow-x:auto}.month-filter input[type="month"]{padding:6px 10;border:1px solid var(--border);border-radius:10;background:var(--card);font-size:13px}.toast{position:fixed;top:60;left:50%;transform:translateX(-50%);background:var(--pink);color:#fff;padding:10 20;border-radius:20;font-size:13px;z-index:50;opacity:0;transition:opacity 0.3s;pointer-events:none;white-space:nowrap}.toast.show{opacity:1}.detail-header{padding:16px;background:var(--card);border-bottom:1px solid var(--border)}.detail-header h2{font-size:18px;margin-bottom:10}.detail-header .dh-tiers{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.detail-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px;color:var(--text2)}.detail-row .val{color:var(--text);font-weight:500}.detail-actions{padding:12px;display:flex;gap:8px;flex-wrap:wrap}.sell-summary{background:var(--pink-pale);border-radius:12px;padding:14px;margin-bottom:14px}.sell-summary .ss-tier{font-size:15px;font-weight:600;margin-bottom:6px;display:flex;align-items:center;gap:8px}.sell-summary .ss-info{font-size:13px;color:var(--text2);display:flex;gap:16px;flex-wrap:wrap}.sell-profit-box{background:#f8f8f8;border-radius:10;padding:12px;text-align:center;margin-bottom:14px}.sell-profit-box .spb-label{font-size:13px;color:var(--text2);margin-bottom:4px}.sell-profit-box .spb-val{font-size:22px;font-weight:700}.edit-cat-tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11px;color:#fff;margin-left:8px}</style></head><body><div class="topbar" id="topbar"><button class="back" id="backBtn" style="display:none" onclick="goBack()">← 返回</button><h1 id="topbarTitle">微博记账APP</h1><div class="actions" id="topbarActions"></div></div><div class="toast" id="toast"></div><div class="page active" id="page-home"><div class="stats-grid"><div class="stat-card"><div class="label">总投入</div><div class="value" id="stat-invest">¥0</div></div><div class="stat-card"><div class="label">总卖出</div><div class="value green" id="stat-sold">¥0</div></div><div class="stat-card"><div class="label">总盈亏</div><div class="value" id="stat-profit">¥0</div></div><div class="stat-card"><div class="label">库存件数</div><div class="value blue" id="stat-stock">0</div></div><div class="stat-card wide"><div class="label">分类筛选</div><div class="tiers" id="home-filters"></div></div></div><div class="section"><div class="section-title">我的系列 <span class="sub" id="home-series-count"></span></div><div id="home-series-list"></div></div></div><div class="page" id="page-inventory"><div class="section" id="inventory-list"></div></div><div class="page" id="page-sell"><div class="section"><form id="sellForm" onsubmit="saveSale(event)"><div class="form-group"><label>系列名称 *</label><select id="sell-series" required onchange="onSellSeriesChange()"><option value="">请选择...</option></select></div><div class="form-group"><label>品质/类型 *</label><select id="sell-tier" required onchange="onSellTierChange()" disabled><option value="">先选系列名称...</option></select></div><div id="sell-summary" style="display:none;" class="sell-summary"><div class="ss-tier"><span id="ss-series-name"></span><span class="tier-badge" id="ss-tier-badge"></span></div><div class="ss-info"><span id="ss-stock-info"></span><span id="ss-cost-info"></span></div></div><div class="form-row"><div class="form-group" style="margin-bottom:0;"><label>卖了几件 *</label><input type="number" id="sell-qty" value="1" min="1" step="1" onchange="onSellQtyChange()"></div><div class="form-group" style="margin-bottom:0;"><label>卖出总价 (元) *</label><input type="number" id="sell-totalPrice" placeholder="实际总收入" required min="0" step="0.01" oninput="onSellTotalPriceChange()"></div></div><div class="form-group" style="margin-top:10px;"><label>卖出时间</label><input type="date" id="sell-date"></div><div class="form-group"><label>备注</label><textarea id="sell-remark" style="height:30px;" placeholder="卖给谁、平台等"></textarea></div><div id="sell-profit-box" style="display:none;" class="sell-profit-box"><div class="spb-label">单件盈亏</div><div class="spb-val" id="spb-val"></div></div><button type="submit" class="btn btn-primary btn-block" id="sell-submit-btn" disabled>确认卖出</button></form></div></div><div class="page" id="page-flow"><div class="month-filter"><span style="font-size:13px;color:var(--text2);white-space:nowrap;">筛选：</span><input type="month" id="flow-month" onchange="renderFlow()"><button class="btn btn-ghost" style="padding:6px 12px;font-size:12px;" onclick="document.getElementById('flow-month').value='';renderFlow()">清除</button></div><div class="section" id="flow-list"></div></div><div class="page" id="page-settings"><div class="section"><div class="settings-item" onclick="openModal('modal-price')"><span class="si-label">默认每盒价格（装扮类）</span><span><span class="si-value" id="set-defaultPrice">17元</span><span class="si-arrow">›</span></span></div><div class="settings-item" onclick="exportJSON()"><span class="si-label">📤 导出完整数据 (JSON)</span><span class="si-arrow">›</span></div><div class="settings-item" onclick="document.getElementById('import-file-input').click()"><span class="si-label">📥 导入数据 (JSON文件)</span><span class="si-arrow">›</span></div><input type="file" id="import-file-input" accept=".json" style="display:none" onchange="importFromFile(event)"><div class="settings-item" onclick="openModal('modal-import')"><span class="si-label">备份 / 粘贴导入</span><span class="si-arrow">›</span></div><div class="settings-item" onclick="recoverAllData()" style="color:var(--blue);background:#e8f0f8;"><span class="si-label">🔍 扫描恢复旧数据</span><span class="si-arrow">›</span></div><div class="settings-item" onclick="confirmClear()" style="color:var(--red);"><span class="si-label">清空所有数据</span><span class="si-arrow">›</span></div></div></div><div class="page" id="page-detail"><div class="detail-header" id="detail-header"></div><div class="section" id="detail-body"></div><div class="detail-actions" id="detail-actions"></div></div><div class="modal-overlay" id="modal-draw" onclick="if(event.target===this)closeModal('modal-draw')"><div class="modal"><h3>🎰 添加记录</h3><div class="form-group"><label>分类 *</label><select id="draw-category" onchange="onDrawCategoryChange()" style="font-size:14px;"><option value="ornament">微博装扮</option><option value="personality">个性装扮</option><option value="welfare">福利赏</option><option value="avatar">六边形头像</option></select></div><div class="form-group"><label id="draw-name-label">系列名称 *</label><input type="text" id="draw-name" placeholder="如：KT系列、huhu小兔"></div><div id="draw-box-area"><div class="form-row"><div class="form-group" style="margin-bottom:0;"><label>每盒价格 (元) — 可自定义</label><input type="number" id="draw-boxPrice" value="17" min="0" step="0.01" style="font-size:13px;"></div><div class="form-group" style="margin-bottom:0;"><label>数量（盒/次）</label><input type="number" id="draw-boxCount" value="1" min="1" step="1" style="font-size:13px;"></div></div><div class="form-group" style="margin-top:5px;"><label style="font-size:12px;color:var(--text3);"> 总投入（自动计算 <strong id="draw-totalCostDisplay" style="color:var(--pink);font-size:14px;">¥17</strong>） <br><span style="font-size:11px;">手动填写下面可覆盖自动值</span></label><input type="number" id="draw-totalCost" placeholder="留空则自动计算" min="0" step="0.01" style="font-size:13px;"></div></div><div id="draw-ornament-tiers" style="margin-bottom:14px;"><div style="font-size:13px;font-weight:500;color:var(--text2);margin-bottom:8px;">各等级开出数量</div><div class="draw-tier-row"><div class="dtl-label"><span class="tier-badge tier-red">超神款</span></div><div class="count-stepper"><button type="button" onclick="changeDrawCount('legendary',-1)">−</button><input type="number" id="draw-legendary" value="0" min="0"><button type="button" onclick="changeDrawCount('legendary',1)">+</button></div></div><div class="draw-tier-row"><div class="dtl-label"><span class="tier-badge tier-blue">隐藏款</span></div><div class="count-stepper"><button type="button" onclick="changeDrawCount('hidden',-1)">−</button><input type="number" id="draw-hidden" value="0" min="0"><button type="button" onclick="changeDrawCount('hidden',1)">+</button></div></div><div class="draw-tier-row"><div class="dtl-label"><span class="tier-badge tier-amber">稀有款</span></div><div class="count-stepper"><button type="button" onclick="changeDrawCount('rare',-1)">−</button><input type="number" id="draw-rare" value="0" min="0"><button type="button" onclick="changeDrawCount('rare',1)">+</button></div></div><div class="draw-tier-row"><div class="dtl-label"><span class="tier-badge tier-green">普通款</span></div><div class="count-stepper"><button type="button" onclick="changeDrawCount('normal',-1)">−</button><input type="number" id="draw-normal" value="0" min="0"><button type="button" onclick="changeDrawCount('normal',1)">+</button></div></div></div><div id="draw-personality-tiers" style="display:none;margin-bottom:14px;"><div style="font-size:13px;font-weight:500;color:var(--text2);margin-bottom:8px;">各品质（可自定义名称和增删）</div><div id="personality-tier-list"></div><button class="btn btn-ghost" style="width:100%;padding:8px;font-size:12px;margin-top:6px;" onclick="addPersonalityTierRow()">＋ 添加品质行</button></div><div id="draw-welfare-area" style="display:none;"><div class="form-group"><label>福利赏版本（从高到低排列）</label><select id="draw-welfare-version" style="font-size:13px;height:38px;"></select></div><div class="form-group"><label>本次花费 (元)</label><input type="number" id="draw-welfare-price" place dateSellProfitPreview();}document.getElementById('sell-qty').addEventListener('input',onSellQtyChange);document.getElementById('sell-totalPrice').addEventListener('input',onSellTotalPriceChange);function updateSellProfitPreview(){if (!pendingSale)return;const s=state.series.find(x=>x.id===pendingSale.seriesId);if (!s)return;const qty=parseInt(document.getElementById('sell-qty').value)||0;const totalPrice=parseFloat(document.getElementById('sell-totalPrice').value)||0;const unitPrice=qty>0?totalPrice/qty:0;let costPerUnit=0;if (pendingSale.tierType==='fixed'){costPerUnit=s.boxPrice||0;}else if (pendingSale.tierType==='custom'){costPerUnit=(s.boxPrice||25)/(s.totalBoxes||1);}const profitPerUnit=unitPrice-costPerUnit;const box=document.getElementById('sell-profit-box');const el=document.getElementById('spb-val');if (totalPrice>0&&qty>0){box.style.display='block';el.textContent=(profitPerUnit>=0?'盈利':'亏损')+' ¥'+round(Math.abs(profitPerUnit))+'/件';el.style.color=profitPerUnit>=0?'var (--green)':'var (--red)';}else{box.style.display='none';}}function saveSale(e){e.preventDefault();if (!pendingSale){toast('请先选择系列和品质');return;}const qty=parseInt(document.getElementById('sell-qty').value)||0;const totalPrice=parseFloat(document.getElementById('sell-totalPrice').value);const soldAt=document.getElementById('sell-date').value||new Date().toISOString().substring(0,10);const remark=document.getElementById('sell-remark').value.trim();if (!qty||qty<=0){toast('请输入卖出数量');return;}if (!totalPrice||totalPrice<=0){toast('请输入正确的卖出总价');return;}if (pendingSale.stock!==undefined&&qty>pendingSale.stock){toast('库存不足，最多可卖 '+pendingSale.stock+' 件');return;}const s=state.series.find(x=>x.id===pendingSale.seriesId);if (!s)return;const unitPrice=totalPrice/qty;const now=new Date().toISOString();for (let i=0;i<qty;i++){let tierValue=pendingSale.tier;let tierNameForLog='';if (pendingSale.tierType==='fixed'){tierValue=pendingSale.tier;tierNameForLog=TIER_NAMES[pendingSale.tier]||pendingSale.tier;}else if (pendingSale.tierType==='custom'){const ct=(s.customTiers||[])[pendingSale.customIndex];tierValue='__custom_'+(pendingSale.customIndex||0);tierNameForLog=ct?ct.name:'未知';}state.sales.push({id:genId(),seriesId:pendingSale.seriesId,seriesName:s.name,tier:tierValue,tierDisplayName:tierNameForLog,soldPrice:round(unitPrice),soldAt,remark,createdAt:now});if (pendingSale.tierType==='fixed'&&s.tiers){s.tiers[pendingSale.tier]=(s.tiers[pendingSale.tier]||0)-1;}else if (pendingSale.tierType==='custom'&&s.customTiers&&pendingSale.customIndex!==undefined){if (s.customTiers[pendingSale.customIndex]){s.customTiers[pendingSale.customIndex].count=(s.customTiers[pendingSale.customIndex].count||0)-1;}}}saveData();toast(`卖出成功 ${qty}件，共 ¥${round(totalPrice)}`);nav('inventory');}function renderFlow(){const month=document.getElementById('flow-month').value;const items=[...state.series.map(s=>({type:'expense',name:`${s.name}${s.category?('['+CATEGORY_NAMES[s.category]+']'):''}`,amount:getSeriesInvest(s),date:s.createdAt,tier:null,id:s.id})),...state.sales.map(s=>({type:'income',name:`${s.seriesName||'?'}${s.tierDisplayName?('-'+s.tierDisplayName):''}`,amount:parseFloat(s.soldPrice)||0,date:s.soldAt,tier:s.tier,id:s.id}))].filter(item=>!month||(item.date&&item.date.startsWith(month))).sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));const el=document.getElementById('flow-list');if (items.length===0){el.innerHTML='<div class="empty"><div class="empty-icon">📝</div><p>暂无记录</p></div>';return;}el.innerHTML=items.map(item=>`<div class="flow-item"><div class="flow-left"><div class="flow-name">${item.tier&&item.tier.startsWith('__custom_')?'':(item.tier?`<span class="tier-badge ${TIER_CLASS[item.tier]||''}" style="font-size:10px;padding:1px 6px;margin-right:4px;">${item.tier&&TIER_NAMES[item.tier]?TIER_NAMES[item.tier]:''}</span>`:'')}${item.name}</div><div class="flow-time">${formatDate(item.date)}</div></div><div class="flow-right"><div class="flow-amount ${item.type}">${item.type==='expense'?'-':'+'}¥${round(item.amount)}</div></div></div>`).join('');}function renderSettings(){document.getElementById('set-defaultPrice').textContent=state.settings.defaultBoxPrice+'元';}function saveDefaultPrice(){const val=parseFloat(document.getElementById('modal-price-input').value);if (!val||val<=0){toast('请输入正确的价格');return;}state.settings.defaultBoxPrice=val;saveData();renderSettings();closeModal('modal-price');toast('已保存');}function recoverAllData(){const found=[];for (let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if (!k)continue;if (/ornament|wb_|weibo|data/i.test(k)){try{const v=localStorage.getItem(k);let info={key:k,size:v.length};try{const p=JSON.parse(v);info.seriesCount=(p.series||[]).length;info.salesCount=(p.sales||[]).length;info.version=p.version||'?';}catch (e){info.preview=v.substring(0,80);}found.push(info);}catch (e){}}}if (found.length===0){alert('没有找到任何旧数据。可能原因：1.数据在另一个浏览器 2.缓存已清除 3.之前用的不同网址');return;}let msg='找到 '+found.length+' 条存储数据：\n\n';found.forEach((f,i)=>{msg+='['+(i+1)+']'+f.key+'('+f.size+'字节)';if (f.seriesCount!==undefined){msg+='\n 系列:'+f.seriesCount+'|流水:'+f.salesCount+'|v'+f.version;}else if (f.preview){msg+='\n '+f.preview;}msg+='\n\n';});msg+='点击确定导入数据最多的那条。';if (!confirm(msg))return;found.sort((a,b)=>((b.seriesCount||0)+(b.salesCount||0))-((a.seriesCount||0)+(a.salesCount||0)));const best=found[0];const raw=localStorage.getItem(best.key);try{const data=JSON.parse(raw);if (data.series&&data.series.length>0)state.series=data.series;if (data.sales&&data.sales.length>0)state.sales=data.sales;if (data.settings)state.settings={...state.settings,...data.settings};saveData();renderHome();toast('已恢复 '+state.series.length+' 个系列+'+state.sales.length+' 笔流水');}catch (e){alert('数据解析失败:'+e.message);}}function confirmClear(){confirm('确定要清空所有数据吗？此操作不可恢复！',()=>{state={series:[],sales:[],settings:{defaultBoxPrice:17},version:3};saveData();toast('已清空');nav('home');});}function confirm(msg,callback){document.getElementById('confirm-msg').textContent=msg;document.getElementById('confirm-btn').onclick=()=>{closeModal('modal-confirm');callback();};openModal('modal-confirm');}function doConfirm(){}function exportJSON(){const data=JSON.stringify(state,null,2);const blob=new Blob([data],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='微博记账APP-备份.json';a.click();URL.revokeObjectURL(a.href);toast('数据已导出');}function importFromFile(e){const file=e.target.files[0];if (!file)return;const reader=new FileReader();reader.onload=function (ev){try{const data=JSON.parse(ev.target.result);if (!data.series)throw new Error('Invalid');state=data;if (!state.settings)state.settings={defaultBoxPrice:17};saveData();toast('数据已恢复');nav('home');}catch (err){toast('文件格式错误');}};reader.readAsText(file);e.target.value='';}function doImport(){const text=document.getElementById('import-textarea').value.trim();if (!text){toast('请粘贴数据');return;}try{const data=JSON.parse(text);if (!data.series)throw new Error('Invalid');state=data;if (!state.settings)state.settings={defaultBoxPrice:17};saveData();closeModal('modal-import');toast('数据已恢复');nav('home');}catch (e){toast('数据格式错误，导入失败');}}loadData();nav('home');</script></body></html>

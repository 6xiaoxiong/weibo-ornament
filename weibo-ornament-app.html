<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>微博装扮记账</title>
<link rel="icon" href="favicon.png" type="image/png">
<style>
:root {
  --pink: #d484a9;
  --pink-light: #fce4f0;
  --pink-mid: #f5d0e5;
  --pink-pale: #fdf2f8;
  --bg: #faf8f8;
  --card: #fff;
  --border: #ede0e5;
  --text: #3a3a3a;
  --text2: #8a7a80;
  --text3: #b5a5ac;
  --green: #6b9e7c;
  --red: #c4687a;
  --amber: #d4a76a;
  --blue: #7a9ec4;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); line-height: 1.5; font-size: 14px; max-width: 480px; margin: 0 auto; min-height: 100dvh; padding-bottom: 70px; }
input, select, textarea, button { font-family: inherit; font-size: inherit; }
textarea { resize: none; }

/* top bar */
.topbar { background: var(--card); padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
.topbar::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 1px; background: repeating-linear-gradient(90deg, var(--pink-mid) 0, var(--pink-mid) 8px, transparent 8px, transparent 12px); }
.topbar h1 { font-size: 16px; font-weight: 600; color: var(--text); }
.topbar .back { background: none; border: none; color: var(--pink); font-size: 14px; cursor: pointer; padding: 4px 8px; }
.topbar .actions { display: flex; gap: 8px; }

/* stat cards */
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px; }
.stat-card { background: var(--card); border-radius: 16px; padding: 14px; border: 1px solid var(--border); box-shadow: 0 2px 12px rgba(212,132,169,0.06); }
.stat-card .label { font-size: 12px; color: var(--text2); margin-bottom: 4px; }
.stat-card .value { font-size: 20px; font-weight: 700; }
.stat-card .value.green { color: var(--green); }
.stat-card .value.red { color: var(--red); }
.stat-card .value.blue { color: var(--blue); }
.stat-card.wide { grid-column: span 2; }
.stat-card .tiers { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }

/* tier badge */
.tier-badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 500; display: inline-block; }
.tier-green { background: #eaf3ee; color: var(--green); }
.tier-amber { background: #faf2e0; color: var(--amber); }
.tier-blue { background: #e8f0f8; color: var(--blue); }
.tier-red { background: #fce8ec; color: var(--red); }

/* section */
.section { padding: 12px; }
.section-title { font-size: 13px; color: var(--text2); margin-bottom: 10px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; }
.section-title .sub { font-size: 12px; color: var(--text3); font-weight: 400; }

/* series card */
.series-card { background: var(--card); border-radius: 16px; padding: 14px; margin-bottom: 10px; border: 1px solid var(--border); box-shadow: 0 2px 8px rgba(212,132,169,0.04); cursor: pointer; transition: all 0.15s; }
.series-card:active { background: var(--pink-pale); }
.series-card .sc-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
.series-card .sc-name { font-weight: 600; font-size: 15px; }
.series-card .sc-meta { font-size: 12px; color: var(--text2); margin-top: 2px; }
.series-card .sc-tiers { display: flex; gap: 6px; flex-wrap: wrap; }
.series-card .sc-tier-item { display: flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 10px; background: var(--bg); font-size: 12px; }
.series-card .sc-tier-item .t-name { color: var(--text2); }
.series-card .sc-tier-item .t-count { font-weight: 700; color: var(--text); }

/* form */
.form-group { margin-bottom: 14px; }
.form-group label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; color: var(--text2); }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: 12px; background: var(--card); font-size: 14px; color: var(--text); outline: none; transition: border 0.15s; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--pink); }
.form-group textarea { height: 60px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; transition: opacity 0.15s; }
.btn:active { opacity: 0.8; }
.btn-primary { background: var(--pink); color: #fff; box-shadow: 0 2px 8px rgba(212,132,169,0.3); }
.btn-danger { background: var(--red); color: #fff; }
.btn-ghost { background: var(--card); color: var(--text); border: 1.5px solid var(--border); }
.btn-block { width: 100%; }

/* count stepper */
.count-stepper { display: flex; align-items: center; border: 1.5px solid var(--border); border-radius: 12px; overflow: hidden; }
.count-stepper button { width: 40px; height: 40px; border: none; background: var(--pink-pale); font-size: 20px; cursor: pointer; color: var(--pink); }
.count-stepper button:active { background: var(--pink-light); }
.count-stepper input { width: 60px; height: 40px; border: none; text-align: center; font-size: 16px; font-weight: 600; border-left: 1.5px solid var(--border); border-right: 1.5px solid var(--border); outline: none; background: var(--card); }

/* draw tier row */
.draw-tier-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--border); }
.draw-tier-row:last-child { border-bottom: none; }
.draw-tier-row .dtl-label { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 8px; }

/* bottom nav */
.bottom-nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--card); border-top: 1px solid var(--border); display: flex; z-index: 20; }
.nav-item { flex: 1; padding: 10px 4px; text-align: center; cursor: pointer; border: none; background: none; color: var(--text3); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 3px; transition: color 0.15s; }
.nav-item.active { color: var(--pink); }
.nav-item svg { width: 22px; height: 22px; }
.nav-item .nav-add { width: 44px; height: 44px; background: var(--pink); color: #fff; border-radius: 50%; margin-top: -16px; display: flex; align-items: center; justify-content: center; font-size: 24px; box-shadow: 0 2px 10px rgba(212,132,169,0.35); }

/* pages */
.page { display: none; }
.page.active { display: block; }

/* flow list */
.flow-item { background: var(--card); border-radius: 14px; padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 6px rgba(212,132,169,0.04); }
.flow-item .flow-left { display: flex; flex-direction: column; gap: 3px; }
.flow-item .flow-name { font-weight: 500; font-size: 14px; }
.flow-item .flow-time { font-size: 12px; color: var(--text3); }
.flow-item .flow-right { text-align: right; }
.flow-item .flow-amount { font-weight: 600; font-size: 15px; }
.flow-item .flow-amount.income { color: var(--green); }
.flow-item .flow-amount.expense { color: var(--red); }

/* modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(58,58,58,0.35); z-index: 30; display: none; align-items: flex-end; justify-content: center; }
.modal-overlay.active { display: flex; }
.modal { background: var(--card); border-radius: 20px 20px 0 0; width: 100%; max-width: 480px; max-height: 90dvh; overflow-y: auto; padding: 20px; animation: slideUp 0.2s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal h3 { font-size: 16px; font-weight: 600; margin-bottom: 16px; text-align: center; color: var(--text); }
.modal .modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal .modal-actions .btn { flex: 1; }

/* settings */
.settings-item { background: var(--card); border-radius: 14px; padding: 14px 16px; margin-bottom: 8px; border: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: background 0.15s; }
.settings-item:active { background: var(--pink-pale); }
.settings-item .si-label { font-size: 14px; }
.settings-item .si-value { color: var(--text2); font-size: 13px; }
.settings-item .si-arrow { color: var(--text3); }

/* empty */
.empty { text-align: center; padding: 40px 20px; color: var(--text3); }
.empty-icon { font-size: 48px; margin-bottom: 12px; }
.empty p { font-size: 14px; }

/* month filter */
.month-filter { padding: 8px 12px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; overflow-x: auto; }
.month-filter input[type="month"] { padding: 6px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); font-size: 13px; }

/* toast */
.toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: var(--pink); color: #fff; padding: 10px 20px; border-radius: 20px; font-size: 13px; z-index: 50; opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
.toast.show { opacity: 1; }

/* quick draw btn */
.quick-draw-btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 24px); margin: 0 12px 12px; padding: 14px; background: var(--pink); color: #fff; border: none; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer; box-shadow: 0 2px 10px rgba(212,132,169,0.3); transition: all 0.15s; }
.quick-draw-btn:active { opacity: 0.85; transform: scale(0.98); }

/* detail page */
.detail-header { padding: 16px; background: var(--card); border-bottom: 1px solid var(--border); }
.detail-header h2 { font-size: 18px; margin-bottom: 10px; }
.detail-header .dh-tiers { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.detail-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; color: var(--text2); }
.detail-row .val { color: var(--text); font-weight: 500; }
.detail-actions { padding: 12px; display: flex; gap: 8px; }

/* sell page */
.sell-summary { background: var(--pink-pale); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
.sell-summary .ss-tier { font-size: 15px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
.sell-summary .ss-info { font-size: 13px; color: var(--text2); display: flex; gap: 16px; }
.sell-profit-box { background: #f8f8f8; border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 14px; }
.sell-profit-box .spb-label { font-size: 13px; color: var(--text2); margin-bottom: 4px; }
.sell-profit-box .spb-val { font-size: 22px; font-weight: 700; }
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar" id="topbar">
  <button class="back" id="backBtn" style="display:none" onclick="goBack()">← 返回</button>
  <h1 id="topbarTitle">微博装扮记账</h1>
  <div class="actions" id="topbarActions"></div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- PAGE: HOME -->
<div class="page active" id="page-home">
  <button class="quick-draw-btn" onclick="openDrawModal()">🎰 抽卡记录</button>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="label">总投入</div>
      <div class="value" id="stat-invest">¥0</div>
    </div>
    <div class="stat-card">
      <div class="label">总卖出</div>
      <div class="value green" id="stat-sold">¥0</div>
    </div>
    <div class="stat-card">
      <div class="label">总盈亏</div>
      <div class="value" id="stat-profit">¥0</div>
    </div>
    <div class="stat-card">
      <div class="label">库存件数</div>
      <div class="value blue" id="stat-stock">0</div>
    </div>
    <div class="stat-card wide">
      <div class="label">各等级库存</div>
      <div class="tiers" id="stat-tiers"></div>
    </div>
  </div>
  <div class="section">
    <div class="section-title">我的系列 <span class="sub" id="home-series-count"></span></div>
    <div id="home-series-list"></div>
  </div>
</div>

<!-- PAGE: INVENTORY -->
<div class="page" id="page-inventory">
  <div class="section" id="inventory-list"></div>
</div>

<!-- PAGE: SELL -->
<div class="page" id="page-sell">
  <div class="section">
    <form id="sellForm" onsubmit="saveSale(event)">
      <div class="form-group">
        <label>选择系列 *</label>
        <select id="sell-series" required onchange="onSellSeriesChange()">
          <option value="">请选择系列...</option>
        </select>
      </div>

      <div class="form-group">
        <label>选择要卖出的等级 *</label>
        <select id="sell-tier" required onchange="onSellTierChange()" disabled>
          <option value="">先选系列...</option>
        </select>
      </div>

      <div id="sell-summary" style="display:none;" class="sell-summary">
        <div class="ss-tier">
          <span id="ss-series-name"></span>
          <span class="tier-badge" id="ss-tier-badge"></span>
        </div>
        <div class="ss-info">
          <span>该等级库存：<strong id="ss-stock"></strong> 件</span>
          <span>每盒成本：<strong id="ss-cost"></strong></span>
        </div>
      </div>

      <div class="form-group">
        <label>卖出到手金额 (元) *</label>
        <input type="number" id="sell-price" placeholder="实际收到的钱" required min="0" step="0.1">
      </div>

      <div class="form-group">
        <label>卖出时间</label>
        <input type="date" id="sell-date">
      </div>

      <div class="form-group">
        <label>卖出备注</label>
        <textarea id="sell-remark" placeholder="卖给谁、平台、交易方式等"></textarea>
      </div>

      <div id="sell-profit-box" style="display:none;" class="sell-profit-box">
        <div class="spb-label">预计盈亏</div>
        <div class="spb-val" id="spb-val"></div>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="sell-submit-btn" disabled>确认卖出</button>
    </form>
  </div>
</div>

<!-- PAGE: FLOW -->
<div class="page" id="page-flow">
  <div class="month-filter">
    <span style="font-size:13px;color:var(--text2);white-space:nowrap;">筛选：</span>
    <input type="month" id="flow-month" onchange="renderFlow()">
    <button class="btn btn-ghost" style="padding:6px 12px;font-size:12px;" onclick="document.getElementById('flow-month').value='';renderFlow()">清除</button>
  </div>
  <div class="section" id="flow-list"></div>
</div>

<!-- PAGE: SETTINGS -->
<div class="page" id="page-settings">
  <div class="section">
    <div class="settings-item" onclick="openModal('modal-price')">
      <span class="si-label">默认每盒价格</span>
      <span><span class="si-value" id="set-defaultPrice">17元</span> <span class="si-arrow">›</span></span>
    </div>
    <div class="settings-item" onclick="exportData()">
      <span class="si-label">导出数据 (Excel)</span>
      <span class="si-arrow">›</span>
    </div>
    <div class="settings-item" onclick="openModal('modal-import')">
      <span class="si-label">备份 / 恢复数据</span>
      <span class="si-arrow">›</span>
    </div>
    <div class="settings-item" onclick="confirmClear()" style="color:var(--red);">
      <span class="si-label">清空所有数据</span>
      <span class="si-arrow">›</span>
    </div>
  </div>
</div>

<!-- PAGE: DETAIL -->
<div class="page" id="page-detail">
  <div class="detail-header" id="detail-header"></div>
  <div class="section" id="detail-body"></div>
  <div class="detail-actions">
    <button class="btn btn-ghost" onclick="editCurrentSeries()">编辑</button>
    <button class="btn btn-primary" onclick="sellFromDetail()">卖出</button>
  </div>
</div>

<!-- MODAL: 抽卡 -->
<div class="modal-overlay" id="modal-draw" onclick="if(event.target===this)closeModal('modal-draw')">
  <div class="modal">
    <h3>🎰 抽卡记录</h3>

    <div class="form-group">
      <label>系列名称 *</label>
      <input type="text" id="draw-name" placeholder="如：KT系列、huhu小兔" required>
    </div>

    <div class="form-row">
      <div class="form-group" style="margin-bottom:0;">
        <label style="font-size:12px;">每盒价格 (元)</label>
        <input type="number" id="draw-boxPrice" value="17" min="0" step="0.1" style="font-size:13px;">
      </div>
      <div class="form-group" style="margin-bottom:0;">
        <label style="font-size:12px;">抽了多少盒</label>
        <input type="number" id="draw-boxCount" value="1" min="1" step="1" style="font-size:13px;">
      </div>
    </div>

    <div class="form-group" style="margin-top:10px;">
      <label style="font-size:12px;color:var(--text3);">本次总成本：<strong id="draw-totalCost" style="color:var(--pink);font-size:16px;">¥17</strong></label>
    </div>

    <div style="margin-bottom:14px;">
      <div style="font-size:13px;font-weight:500;color:var(--text2);margin-bottom:8px;">本次各等级开出数量</div>
      <div class="draw-tier-row">
        <div class="dtl-label"><span class="tier-badge tier-red">超神款</span></div>
        <div class="count-stepper">
          <button type="button" onclick="changeDrawCount('legendary',-1)">−</button>
          <input type="number" id="draw-legendary" value="0" min="0">
          <button type="button" onclick="changeDrawCount('legendary',1)">+</button>
        </div>
      </div>
      <div class="draw-tier-row">
        <div class="dtl-label"><span class="tier-badge tier-blue">隐藏款</span></div>
        <div class="count-stepper">
          <button type="button" onclick="changeDrawCount('hidden',-1)">−</button>
          <input type="number" id="draw-hidden" value="0" min="0">
          <button type="button" onclick="changeDrawCount('hidden',1)">+</button>
        </div>
      </div>
      <div class="draw-tier-row">
        <div class="dtl-label"><span class="tier-badge tier-amber">稀有款</span></div>
        <div class="count-stepper">
          <button type="button" onclick="changeDrawCount('rare',-1)">−</button>
          <input type="number" id="draw-rare" value="0" min="0">
          <button type="button" onclick="changeDrawCount('rare',1)">+</button>
        </div>
      </div>
      <div class="draw-tier-row">
        <div class="dtl-label"><span class="tier-badge tier-green">普通款</span></div>
        <div class="count-stepper">
          <button type="button" onclick="changeDrawCount('normal',-1)">−</button>
          <input type="number" id="draw-normal" value="0" min="0">
          <button type="button" onclick="changeDrawCount('normal',1)">+</button>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>备注</label>
      <textarea id="draw-remark" placeholder="抽的时间、活动名称等"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-draw')">取消</button>
      <button class="btn btn-primary" onclick="submitDraw()">确认入库</button>
    </div>
  </div>
</div>

<!-- MODAL: default price -->
<div class="modal-overlay" id="modal-price" onclick="if(event.target===this)closeModal('modal-price')">
  <div class="modal">
    <h3>默认每盒价格</h3>
    <div class="form-group">
      <input type="number" id="modal-price-input" value="17" min="0" step="0.1">
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-price')">取消</button>
      <button class="btn btn-primary" onclick="saveDefaultPrice()">保存</button>
    </div>
  </div>
</div>

<!-- MODAL: confirm -->
<div class="modal-overlay" id="modal-confirm" onclick="if(event.target===this)closeModal('modal-confirm')">
  <div class="modal">
    <h3 id="confirm-title">确认操作</h3>
    <p id="confirm-msg" style="text-align:center;color:var(--text2);margin-bottom:16px;font-size:14px;"></p>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-confirm')">取消</button>
      <button class="btn btn-danger" id="confirm-btn" onclick="doConfirm()">确认</button>
    </div>
  </div>
</div>

<!-- MODAL: import -->
<div class="modal-overlay" id="modal-import" onclick="if(event.target===this)closeModal('modal-import')">
  <div class="modal">
    <h3>导入 / 恢复数据</h3>
    <div class="form-group">
      <label>粘贴备份 JSON 数据</label>
      <textarea id="import-textarea" style="height:120px;" placeholder="将之前导出的 JSON 数据粘贴在此..."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('modal-import')">取消</button>
      <button class="btn btn-primary" onclick="doImport()">导入</button>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav">
  <button class="nav-item active" data-page="home" onclick="nav('home')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
    首页
  </button>
  <button class="nav-item" data-page="inventory" onclick="nav('inventory')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
    库存
  </button>
  <button class="nav-item" onclick="nav('sell')">
    <div class="nav-add">卖</div>
  </button>
  <button class="nav-item" data-page="flow" onclick="nav('flow')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    流水
  </button>
  <button class="nav-item" data-page="settings" onclick="nav('settings')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
    我的
  </button>
</div>

<script>
// ========== DATA ==========
const STORAGE_KEY = 'wb_ornament_v3';
const TIER_ORDER = ['legendary','hidden','rare','normal'];
const TIER_NAMES = { normal:'普通', rare:'稀有', hidden:'隐藏', legendary:'超神' };
const TIER_CLASS = { normal:'tier-green', rare:'tier-amber', hidden:'tier-blue', legendary:'tier-red' };

let state = { series: [], sales: [], settings: { defaultBoxPrice: 17 }, version: 3 };
let currentPage = 'home';
let prevPageStack = [];
let detailSeriesId = null;
let confirmCallback = null;
let pendingSale = null;  // { seriesId, tier }

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      state.series = parsed.series || [];
      state.sales = parsed.sales || [];
      state.settings = parsed.settings || { defaultBoxPrice: 17 };
    }
  } catch(e) {}
}

function saveData() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e) { toast('存储空间不足！'); }
}

// ========== UI ==========
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

function nav(page) {
  prevPageStack.push(currentPage);
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => { if (n.dataset.page === page) n.classList.add('active'); });
  const titles = { home:'微博装扮记账', inventory:'库存管理', sell:'卖出', flow:'收支流水', settings:'我的', detail:'系列详情' };
  document.getElementById('topbarTitle').textContent = titles[page] || '微博装扮记账';
  document.getElementById('backBtn').style.display = 'none';
  currentPage = page;
  refreshPage(page);
}

function goBack() {
  if (prevPageStack.length > 0) {
    const prev = prevPageStack.pop();
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + prev).classList.add('active');
    currentPage = prev;
    refreshPage(prev);
    document.getElementById('backBtn').style.display = prev === 'detail' ? 'inline-block' : 'none';
    document.getElementById('topbarTitle').textContent = '微博装扮记账';
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  }
}

function refreshPage(page) {
  if (page === 'home') renderHome();
  if (page === 'inventory') renderInventory();
  if (page === 'sell') initSellPage();
  if (page === 'flow') renderFlow();
  if (page === 'settings') renderSettings();
}

function openModal(id) { document.getElementById(id).classList.add('active'); }
function closeModal(id) { document.getElementById(id).classList.remove('active'); }

// ========== HELPERS ==========
function genId() { return Date.now().toString(36) + Math.random().toString(36).substr(2, 9); }
function round(n) { return Math.round((parseFloat(n) || 0) * 100) / 100; }
function formatDate(d) {
  if (!d) return '';
  const dt = new Date(d);
  return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
}

// 计算某系列某等级的剩余库存
function getStock(seriesId, tier) {
  const s = state.series.find(x => x.id === seriesId);
  if (!s) return 0;
  const total = s.tiers[tier] || 0;
  const sold = state.sales.filter(x => x.seriesId === seriesId && x.tier === tier).length;
  return total - sold;
}

// 计算某系列总库存
function getSeriesStock(s) {
  return TIER_ORDER.reduce((sum, t) => sum + getStock(s.id, t), 0);
}

// ========== DRAW MODAL ==========
function openDrawModal() {
  document.getElementById('draw-name').value = '';
  document.getElementById('draw-boxPrice').value = state.settings.defaultBoxPrice;
  document.getElementById('draw-boxCount').value = 1;
  document.getElementById('draw-remark').value = '';
  document.getElementById('draw-legendary').value = '0';
  document.getElementById('draw-hidden').value = '0';
  document.getElementById('draw-rare').value = '0';
  document.getElementById('draw-normal').value = '0';
  updateDrawTotal();
  openModal('modal-draw');
}

function changeDrawCount(tier, delta) {
  const input = document.getElementById('draw-' + tier);
  let val = parseInt(input.value) || 0;
  val = Math.max(0, val + delta);
  input.value = val;
}

function updateDrawTotal() {
  const price = parseFloat(document.getElementById('draw-boxPrice').value) || state.settings.defaultBoxPrice;
  const count = parseInt(document.getElementById('draw-boxCount').value) || 1;
  document.getElementById('draw-totalCost').textContent = '¥' + round(price * count);
}

['draw-boxPrice','draw-boxCount'].forEach(id => {
  document.getElementById(id).addEventListener('change', updateDrawTotal);
  document.getElementById(id).addEventListener('input', updateDrawTotal);
});

function submitDraw() {
  const name = document.getElementById('draw-name').value.trim();
  if (!name) { toast('请输入系列名称'); return; }
  const boxPrice = parseFloat(document.getElementById('draw-boxPrice').value) || state.settings.defaultBoxPrice;
  const boxCount = parseInt(document.getElementById('draw-boxCount').value) || 1;
  const legendary = parseInt(document.getElementById('draw-legendary').value) || 0;
  const hidden = parseInt(document.getElementById('draw-hidden').value) || 0;
  const rare = parseInt(document.getElementById('draw-rare').value) || 0;
  const normal = parseInt(document.getElementById('draw-normal').value) || 0;
  const totalItems = legendary + hidden + rare + normal;
  if (totalItems === 0) { toast('请填写至少一个等级的件数'); return; }
  const remark = document.getElementById('draw-remark').value.trim();
  const now = new Date().toISOString();

  state.series.push({
    id: genId(),
    name,
    boxPrice,
    totalBoxes: boxCount,
    tiers: { legendary, hidden, rare, normal },
    remark,
    createdAt: now,
    updatedAt: now
  });

  saveData();
  closeModal('modal-draw');
  const totalCost = boxPrice * boxCount;
  toast(`已入库 ${totalItems} 件，共 ¥${round(totalCost)}`);
  renderHome();
}

// ========== HOME ==========
function renderHome() {
  const totalInvest = state.series.reduce((s, se) => s + (se.boxPrice * se.totalBoxes), 0);
  const totalSold = state.sales.reduce((s, sa) => s + (parseFloat(sa.soldPrice) || 0), 0);
  const totalProfit = totalSold - totalInvest;
  const totalStock = state.series.reduce((s, se) => s + getSeriesStock(se), 0);

  document.getElementById('stat-invest').textContent = '¥' + round(totalInvest);
  document.getElementById('stat-sold').textContent = '¥' + round(totalSold);
  const profitEl = document.getElementById('stat-profit');
  profitEl.textContent = (totalProfit >= 0 ? '+' : '') + '¥' + round(totalProfit);
  profitEl.className = 'value ' + (totalProfit >= 0 ? 'green' : 'red');
  document.getElementById('stat-stock').textContent = totalStock;

  // global tier counts
  const tierCounts = { legendary:0, hidden:0, rare:0, normal:0 };
  state.series.forEach(s => {
    TIER_ORDER.forEach(t => { tierCounts[t] += getStock(s.id, t); });
  });
  document.getElementById('stat-tiers').innerHTML = TIER_ORDER.map(t =>
    `<span class="tier-badge ${TIER_CLASS[t]}">${TIER_NAMES[t]}${tierCounts[t]}</span>`
  ).join('');

  // series list
  const listEl = document.getElementById('home-series-list');
  const countEl = document.getElementById('home-series-count');
  countEl.textContent = `共 ${state.series.length} 个系列`;

  if (state.series.length === 0) {
    listEl.innerHTML = '<div class="empty"><div class="empty-icon">📦</div><p>暂无系列，试试点「抽卡记录」入库吧</p></div>';
    return;
  }

  listEl.innerHTML = state.series.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(s => {
    const stock = getSeriesStock(s);
    const tierHtml = TIER_ORDER.map(t => {
      const c = getStock(s.id, t);
      if (c <= 0) return '';
      return `<span class="sc-tier-item"><span class="t-name">${TIER_NAMES[t]}</span><span class="t-count">${c}</span></span>`;
    }).filter(Boolean).join('');

    return `
      <div class="series-card" onclick="showDetail('${s.id}')">
        <div class="sc-header">
          <div>
            <div class="sc-name">${s.name}</div>
            <div class="sc-meta">${s.totalBoxes}盒 × ¥${round(s.boxPrice)} ｜ 库存${stock}件</div>
          </div>
        </div>
        <div class="sc-tiers">${tierHtml || '<span style="color:var(--text3);font-size:12px;">已售罄</span>'}</div>
      </div>
    `;
  }).join('');
}

// ========== INVENTORY ==========
function renderInventory() {
  const el = document.getElementById('inventory-list');
  if (state.series.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">🎭</div><p>暂无库存</p></div>';
    return;
  }

  el.innerHTML = state.series.sort((a,b) => new Date(b.createdAt) - new Date(a.createdAt)).map(s => {
    const stock = getSeriesStock(s);
    const tierHtml = TIER_ORDER.map(t => {
      const c = getStock(s.id, t);
      const total = s.tiers[t] || 0;
      return `<div class="detail-row"><span>${TIER_NAMES[t]}</span><span class="val">${c} / ${total}</span></div>`;
    }).join('');

    return `
      <div class="series-card" onclick="showDetail('${s.id}')">
        <div class="sc-header">
          <div>
            <div class="sc-name">${s.name}</div>
            <div class="sc-meta">${s.totalBoxes}盒 × ¥${round(s.boxPrice)}</div>
          </div>
        </div>
        ${tierHtml}
        <div style="margin-top:8px;font-size:12px;color:var(--text3);">剩余库存：${stock}件</div>
      </div>
    `;
  }).join('');
}

// ========== DETAIL ==========
function showDetail(id) {
  detailSeriesId = id;
  const s = state.series.find(x => x.id === id);
  if (!s) return;

  document.getElementById('detail-header').innerHTML = `
    <h2>${s.name}</h2>
    <div class="dh-tiers">
      ${TIER_ORDER.map(t => `<span class="tier-badge ${TIER_CLASS[t]}">${TIER_NAMES[t]}${getStock(s.id, t)}</span>`).join('')}
    </div>
    <div class="detail-row"><span>总抽盒数</span><span class="val">${s.totalBoxes}盒</span></div>
    <div class="detail-row"><span>每盒价格</span><span class="val">¥${round(s.boxPrice)}</span></div>
    <div class="detail-row"><span>总投入</span><span class="val">¥${round(s.boxPrice * s.totalBoxes)}</span></div>
    ${s.remark ? `<div style="margin-top:8px;font-size:12px;color:var(--text3);">备注：${s.remark}</div>` : ''}
  `;

  // sales history for this series
  const seriesSales = state.sales.filter(sa => sa.seriesId === id);
  const bodyEl = document.getElementById('detail-body');
  if (seriesSales.length === 0) {
    bodyEl.innerHTML = '<div class="empty"><div class="empty-icon">💰</div><p>该系列暂无卖出记录</p></div>';
  } else {
    const totalSold = seriesSales.reduce((sum, sa) => sum + (parseFloat(sa.soldPrice) || 0), 0);
    const totalCost = seriesSales.length * s.boxPrice;
    const profit = totalSold - totalCost;
    bodyEl.innerHTML = `
      <div class="section-title">卖出记录 <span class="sub">共 ${seriesSales.length} 笔</span></div>
      ${seriesSales.sort((a,b) => new Date(b.soldAt) - new Date(a.soldAt)).map(sa => `
        <div class="flow-item">
          <div class="flow-left">
            <div class="flow-name"><span class="tier-badge ${TIER_CLASS[sa.tier]}" style="font-size:10px;padding:1px 6px;margin-right:4px;">${TIER_NAMES[sa.tier]}</span></div>
            <div class="flow-time">${formatDate(sa.soldAt)}</div>
          </div>
          <div class="flow-right">
            <div class="flow-amount income">+¥${round(sa.soldPrice)}</div>
          </div>
        </div>
      `).join('')}
      <div style="margin-top:10px;padding:10px;background:var(--pink-pale);border-radius:10px;text-align:center;">
        <div style="font-size:12px;color:var(--text2);">该系列盈亏</div>
        <div style="font-size:18px;font-weight:700;color:${profit >= 0 ? 'var(--green)' : 'var(--red)'};">${profit >= 0 ? '+' : ''}¥${round(profit)}</div>
      </div>
    `;
  }

  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-detail').classList.add('active');
  document.getElementById('backBtn').style.display = 'inline-block';
  document.getElementById('topbarTitle').textContent = s.name;
  currentPage = 'detail';
}

function editCurrentSeries() {
  // TODO: edit series
  toast('编辑功能开发中');
}

function sellFromDetail() {
  nav('sell');
  setTimeout(() => {
    document.getElementById('sell-series').value = detailSeriesId;
    onSellSeriesChange();
  }, 50);
}

// ========== SELL ==========
function initSellPage() {
  // populate series select
  const sel = document.getElementById('sell-series');
  sel.innerHTML = '<option value="">请选择系列...</option>' +
    state.series.map(s => `<option value="${s.id}">${s.name}</option>`).join('');

  document.getElementById('sell-tier').innerHTML = '<option value="">先选系列...</option>';
  document.getElementById('sell-tier').disabled = true;
  document.getElementById('sell-summary').style.display = 'none';
  document.getElementById('sell-profit-box').style.display = 'none';
  document.getElementById('sell-submit-btn').disabled = true;
  document.getElementById('sell-price').value = '';
  document.getElementById('sell-date').value = new Date().toISOString().substring(0,10);
  document.getElementById('sell-remark').value = '';
  pendingSale = null;
}

function onSellSeriesChange() {
  const seriesId = document.getElementById('sell-series').value;
  const tierSel = document.getElementById('sell-tier');

  if (!seriesId) {
    tierSel.innerHTML = '<option value="">先选系列...</option>';
    tierSel.disabled = true;
    document.getElementById('sell-summary').style.display = 'none';
    document.getElementById('sell-profit-box').style.display = 'none';
    document.getElementById('sell-submit-btn').disabled = true;
    pendingSale = null;
    return;
  }

  // populate tiers that have stock
  const s = state.series.find(x => x.id === seriesId);
  if (!s) return;

  const availableTiers = TIER_ORDER.filter(t => getStock(seriesId, t) > 0);
  if (availableTiers.length === 0) {
    tierSel.innerHTML = '<option value="">该系列已售罄</option>';
    tierSel.disabled = true;
    document.getElementById('sell-summary').style.display = 'none';
    document.getElementById('sell-submit-btn').disabled = true;
    pendingSale = null;
    return;
  }

  tierSel.innerHTML = '<option value="">选择等级...</option>' +
    availableTiers.map(t => `<option value="${t}">${TIER_NAMES[t]} (剩${getStock(seriesId, t)}件)</option>`).join('');
  tierSel.disabled = false;
}

function onSellTierChange() {
  const seriesId = document.getElementById('sell-series').value;
  const tier = document.getElementById('sell-tier').value;

  if (!seriesId || !tier) {
    document.getElementById('sell-summary').style.display = 'none';
    document.getElementById('sell-profit-box').style.display = 'none';
    document.getElementById('sell-submit-btn').disabled = true;
    pendingSale = null;
    return;
  }

  const s = state.series.find(x => x.id === seriesId);
  if (!s) return;

  const stock = getStock(seriesId, tier);
  pendingSale = { seriesId, tier };

  document.getElementById('sell-summary').style.display = 'block';
  document.getElementById('ss-series-name').textContent = s.name;
  document.getElementById('ss-tier-badge').className = 'tier-badge ' + TIER_CLASS[tier];
  document.getElementById('ss-tier-badge').textContent = TIER_NAMES[tier];
  document.getElementById('ss-stock').textContent = stock;
  document.getElementById('ss-cost').textContent = '¥' + round(s.boxPrice);
  document.getElementById('sell-submit-btn').disabled = false;

  updateSellProfitPreview();
}

document.getElementById('sell-price').addEventListener('input', updateSellProfitPreview);

function updateSellProfitPreview() {
  if (!pendingSale) return;
  const s = state.series.find(x => x.id === pendingSale.seriesId);
  if (!s) return;
  const price = parseFloat(document.getElementById('sell-price').value) || 0;
  const profit = price - s.boxPrice;
  const box = document.getElementById('sell-profit-box');
  const el = document.getElementById('spb-val');
  if (price > 0) {
    box.style.display = 'block';
    el.textContent = (profit >= 0 ? '盈利' : '亏损') + ' ¥' + round(Math.abs(profit));
    el.style.color = profit >= 0 ? 'var(--green)' : 'var(--red)';
  } else {
    box.style.display = 'none';
  }
}

function saveSale(e) {
  e.preventDefault();
  if (!pendingSale) { toast('请选择系列和等级'); return; }
  const soldPrice = parseFloat(document.getElementById('sell-price').value);
  const soldAt = document.getElementById('sell-date').value || new Date().toISOString().substring(0,10);
  const remark = document.getElementById('sell-remark').value.trim();
  if (!soldPrice || soldPrice <= 0) { toast('请输入正确的卖出金额'); return; }

  const stock = getStock(pendingSale.seriesId, pendingSale.tier);
  if (stock <= 0) { toast('该等级库存不足'); return; }

  state.sales.push({
    id: genId(),
    seriesId: pendingSale.seriesId,
    seriesName: state.series.find(s => s.id === pendingSale.seriesId)?.name || '',
    tier: pendingSale.tier,
    soldPrice,
    soldAt,
    remark,
    createdAt: new Date().toISOString()
  });

  saveData();
  toast('卖出成功');
  nav('home');
}

// ========== FLOW ==========
function renderFlow() {
  const month = document.getElementById('flow-month').value;
  const items = [
    ...state.series.map(s => ({ type:'expense', name: s.name, amount: s.boxPrice * s.totalBoxes, date: s.createdAt, tier: null, id: s.id })),
    ...state.sales.map(s => ({ type:'income', name: s.seriesName || state.series.find(x => x.id === s.seriesId)?.name || '?', amount: parseFloat(s.soldPrice) || 0, date: s.soldAt, tier: s.tier, id: s.id }))
  ].filter(item => !month || item.date.startsWith(month))
   .sort((a, b) => new Date(b.date) - new Date(a.date));

  const el = document.getElementById('flow-list');
  if (items.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">📝</div><p>暂无记录</p></div>';
    return;
  }

  el.innerHTML = items.map(item => `
    <div class="flow-item">
      <div class="flow-left">
        <div class="flow-name">${item.tier ? `<span class="tier-badge ${TIER_CLASS[item.tier]}" style="font-size:10px;padding:1px 6px;margin-right:4px;">${TIER_NAMES[item.tier]}</span>` : ''}${item.name}</div>
        <div class="flow-time">${formatDate(item.date)}</div>
      </div>
      <div class="flow-right">
        <div class="flow-amount ${item.type}">${item.type==='expense'?'-':'+'}$¥${round(item.amount)}</div>
      </div>
    </div>
  `).join('');
}

// ========== SETTINGS ==========
function renderSettings() {
  document.getElementById('set-defaultPrice').textContent = state.settings.defaultBoxPrice + '元';
}

function saveDefaultPrice() {
  const val = parseFloat(document.getElementById('modal-price-input').value);
  if (!val || val <= 0) { toast('请输入正确的价格'); return; }
  state.settings.defaultBoxPrice = val;
  saveData();
  renderSettings();
  closeModal('modal-price');
  toast('已保存');
}

function confirmClear() {
  confirm('确定要清空所有数据吗？此操作不可恢复！', () => {
    state = { series: [], sales: [], settings: { defaultBoxPrice: 17 }, version: 3 };
    saveData();
    toast('已清空');
    nav('home');
  });
}

function confirm(msg, callback) {
  document.getElementById('confirm-msg').textContent = msg;
  document.getElementById('confirm-btn').onclick = () => { closeModal('modal-confirm'); callback(); };
  openModal('modal-confirm');
}

function doConfirm() {
  // handled inline
}

// ========== EXPORT ==========
function exportData() {
  if (state.series.length === 0) { toast('暂无数据可导出'); return; }
  const headers = ['系列名称','抽了多少盒','每盒价格','总投入','超神','隐藏','稀有','普通','剩余库存'];
  const rows = state.series.map(s => {
    const totalInvest = s.boxPrice * s.totalBoxes;
    const stock = getSeriesStock(s);
    return [s.name, s.totalBoxes, s.boxPrice, totalInvest, s.tiers.legendary, s.tiers.hidden, s.tiers.rare, s.tiers.normal, stock];
  });
  downloadCSV([headers, ...rows], '微博装扮记账.csv');
  toast('CSV 已下载');
}

function downloadCSV(rows, filename) {
  const csv = rows.map(r => r.map(c => `"${(c===null||c===undefined?'':c).toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = filename; a.click();
}

function doImport() {
  const text = document.getElementById('import-textarea').value.trim();
  if (!text) { toast('请粘贴数据'); return; }
  try {
    const data = JSON.parse(text);
    if (!data.series) throw new Error('Invalid');
    state = data;
    saveData();
    closeModal('modal-import');
    toast('数据已恢复');
    nav('home');
  } catch(e) { toast('数据格式错误，导入失败'); }
}

// ========== INIT ==========
loadData();
nav('home');
</script>
</body>
</html>
